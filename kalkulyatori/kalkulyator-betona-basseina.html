<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор бетона для бассейна</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  background:linear-gradient(135deg,#f7f7f7,#eef2f7);
  margin:0;
  color:#111;
}

.container{
  max-width:540px;
  margin:40px auto 100px;
  padding:28px;
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(14px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.4);
  box-shadow:0 20px 60px rgba(0,0,0,0.08);
}

h1{font-size:24px;margin-bottom:5px;}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#00c853,#00bfa5);
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

input, select, textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid rgba(0,0,0,0.1);
  font-family:inherit;
}

.result{
  margin-top:20px;
  padding:16px;
  border-radius:14px;
  background:#f8fbff;
}

.notice{
  font-size:12px;
  color:#777;
  margin-top:10px;
}

textarea{
  resize:none;
  height:80px;
}

/* ===== MODAL ===== */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:#fff;
  padding:24px;
  border-radius:18px;
  text-align:center;
  width:280px;
  animation:pop .25s ease;
}

@keyframes pop{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

.icon{
  font-size:32px;
  margin-bottom:10px;
}

.modal button{
  margin-top:15px;
}
</style>
<link rel="stylesheet" href="kalkulyatori-ui.css">
</head>

<body>

<div class="container">
  <h1>Калькулятор бетона для бассейна</h1>
  <p class="subtitle">Заполните параметры чаши и получите предварительный расчет объёма и стоимости бетона для проекта бассейна.</p>

  <div>
    <label>Длина (м)</label>
    <input type="number" id="length" value="8">

    <label>Ширина (м)</label>
    <input type="number" id="width" value="4">

    <label>Глубина (м)</label>
    <input type="number" id="depth" value="1.5">

    <label>Толщина бетона (м)</label>
    <input type="number" id="thickness" value="0.2">

    <label>Марка бетона</label>
    <select id="grade">
      <option value="5000">B20</option>
      <option value="5500">B25</option>
      <option value="6000">B30</option>
    </select>

    <label>Регион</label>
    <select id="region">
      <option value="1">Москва / МО</option>
      <option value="1.1">Крупные города</option>
      <option value="1.25">Регионы</option>
    </select>
  </div>

  <button onclick="calculate()">Рассчитать</button>

  <div class="result" id="result" style="display:none;">
    <div>Объём бетона: <b id="volume"></b> м³</div>
    <div>Примерная стоимость:</div>
    <div class="price" id="price"></div>

    <div class="notice" id="rebar"></div>
    <div class="notice" id="mixers"></div>

    <div class="small">* расчёт предварительный, итог уточняется инженером</div>

    <h3 style="margin-top:15px;">Заявка</h3>

    <input type="text" id="name" placeholder="Ваше имя">
    <input type="tel" id="phone" placeholder="Телефон">
    <textarea id="comment" placeholder="Комментарий к заявке"></textarea>

    <button onclick="sendLead()">Отправить заявку</button>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div id="successModal" class="modal">
  <div class="modal-content">
    <div class="icon">✅</div>
    <h3>Заявка отправлена!</h3>
    <p>Мы свяжемся с вами в ближайшее время</p>
    <button onclick="closeModal()">ОК</button>
  </div>
</div>

<script>
function calculate(){

  let L = +document.getElementById('length').value;
  let W = +document.getElementById('width').value;
  let D = +document.getElementById('depth').value;
  let T = +document.getElementById('thickness').value;

  // ===== ПРАВИЛЬНЫЙ РАСЧЁТ =====
  let bottom = L * W * T;
  let wallsLong = 2 * (L * D * T);
  let wallsShort = 2 * (W * D * T);

  let total = (bottom + wallsLong + wallsShort) * 1.1;

  let pricePerM3 = +document.getElementById('grade').value;
  let regionCoef = +document.getElementById('region').value;

  let price = total * pricePerM3 * regionCoef;

  let rebarKg = total * 80;
  let mixers = Math.ceil(total / 7);

  document.getElementById('volume').innerText = total.toFixed(2);
  document.getElementById('price').innerText = Math.round(price).toLocaleString() + " ₽";

  document.getElementById('rebar').innerText =
    "Арматура A500 Ø12: ~ " + Math.round(rebarKg) + " кг";

  document.getElementById('mixers').innerText =
    "Миксеры: ~ " + mixers + " шт.";

  document.getElementById('result').style.display = "block";
}


// ===== ОТПРАВКА (без изменений) =====
async function sendLead(){

  const TOKEN = "8606617823:AAGGTTxEVCkNxc0N6wFsEi_XYVuke39KH_4";
  const CHAT_ID = "8369302291";

  let name = document.getElementById('name').value;
  let phone = document.getElementById('phone').value;
  let comment = document.getElementById('comment').value;

  let volume = document.getElementById('volume').innerText;
  let price = document.getElementById('price').innerText;

  let L = document.getElementById('length').value;
  let W = document.getElementById('width').value;
  let D = document.getElementById('depth').value;
  let T = document.getElementById('thickness').value;

  let gradeText = document.getElementById('grade').selectedOptions[0].text;
  let regionText = document.getElementById('region').selectedOptions[0].text;

  let text =
`🧱 ЗАЯВКА С БЕТОННОГО КАЛЬКУЛЯТОРА

👤 Имя: ${name}
📞 Телефон: ${phone}
💬 Комментарий: ${comment}

📐 Размеры бассейна:
Длина: ${L} м
Ширина: ${W} м
Глубина: ${D} м
Толщина: ${T} м

🧱 Бетон: ${gradeText}
📍 Регион: ${regionText}

📊 Объём: ${volume} м³
💰 Стоимость: ${price}`;

  try{
    let res = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: text
      })
    });

    let data = await res.json();

    if(data.ok){
      document.getElementById("successModal").style.display = "flex";
    }else{
      alert("Ошибка отправки: " + data.description);
    }

  }catch(e){
    alert("Ошибка соединения");
  }
}

function closeModal(){
  document.getElementById("successModal").style.display = "none";
}
</script>

</body>
</html>
