<svg xmlns="http://www.w3.org/2000/svg" width="390" height="800" viewBox="0 0 390 800" role="img" aria-labelledby="title desc"><title id="title">Свободный, связанный и общий хлор в бассейне</title><desc id="desc">Свободный хлор 1,0 мг/л плюс связанный хлор 0,4 мг/л дают общий хлор 1,4 мг/л. Связанный хлор определяют как разницу общего и свободного.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#15334a} .muted{fill:#5c7487}.white{fill:#fff}.navy{fill:#103750}.bold{font-weight:700}.fine{font-size:15px}.small{font-size:17px}.body{font-size:20px}.head{font-size:28px;font-weight:700}.big{font-size:40px;font-weight:700}</style><rect x="0" y="0" width="390" height="800" rx="20" fill="#f2f8fb"/><rect x="12" y="12" width="366" height="776" rx="19" fill="#fff" stroke="#dce9f1" stroke-width="1.5"/><text x="32" y="51" class="muted bold" font-size="13">ХЛОР В ВОДЕ БАССЕЙНА</text><text x="32" y="84" class="bold" font-size="22">Три показателя анализа</text><text x="32" y="109" class="muted" font-size="15">Как они связаны между собой</text><rect x="32" y="136" width="326" height="113" rx="14" fill="#e5f5fa"/><rect x="32" y="136" width="5" height="113" rx="2" fill="#097f9c"/><text x="49" y="170" class="bold" font-size="19">Свободный хлор</text><text x="49" y="210" class="bold" font-size="29">1,0 мг/л</text><text x="49" y="235" class="muted" font-size="14">Обеззараживание воды</text><rect x="32" y="285" width="326" height="113" rx="14" fill="#fff2de"/><rect x="32" y="285" width="5" height="113" rx="2" fill="#b76b16"/><text x="49" y="319" class="bold" font-size="19">Связанный хлор</text><text x="49" y="359" class="bold" font-size="29">0,4 мг/л</text><text x="49" y="384" class="muted" font-size="14">Включает хлорамины</text><rect x="32" y="434" width="326" height="113" rx="14" fill="#e9effd"/><rect x="32" y="434" width="5" height="113" rx="2" fill="#395fc5"/><text x="49" y="468" class="bold" font-size="19">Общий хлор</text><text x="49" y="508" class="bold" font-size="29">1,4 мг/л</text><text x="49" y="533" class="muted" font-size="14">Свободный + связанный</text><text x="195" y="278" class="bold" font-size="25" text-anchor="middle">+</text><text x="195" y="427" class="bold" font-size="25" text-anchor="middle">=</text><text x="32" y="590" class="bold" font-size="18">Как найти связанный хлор</text><rect x="32" y="610" width="326" height="79" rx="12" fill="#f2f8fb"/><text x="195" y="645" class="bold" font-size="22" text-anchor="middle">1,4 − 1,0 = 0,4 мг/л</text><text x="195" y="672" class="muted" font-size="15" text-anchor="middle">общий − свободный</text><rect x="32" y="706" width="233" height="17" rx="4" fill="#22a5bc"/><rect x="265" y="706" width="93" height="17" rx="4" fill="#efae4d"/><text x="32" y="746" class="muted" font-size="14">Свободный</text><text x="358" y="746" class="muted" font-size="14" text-anchor="end">Связанный</text><text x="32" y="770" class="muted" font-size="13">Пример условный · мг/л Cl₂</text></svg>