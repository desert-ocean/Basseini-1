<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" role="img" aria-labelledby="title desc"><title id="title">Микроклимат крытого бассейна</title><desc id="desc">Вертикальная мобильная схема притока вдоль окна, чаши, рабочей зоны и вытяжки.</desc><defs><marker markerUnits="userSpaceOnUse" id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#087a9b"/></marker><marker markerUnits="userSpaceOnUse" id="b" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#c9782e"/></marker></defs><rect width="420" height="900" rx="18" fill="#f7fbfc"/><text x="210" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#193e52">МИКРОКЛИМАТ БАССЕЙНА</text><rect x="38" y="112" width="92" height="224" fill="#e7f4f8" stroke="#60a2b4" stroke-width="4"/><path d="M70 119V330M100 119V330" stroke="#9fcbd5" stroke-width="3"/><text x="84" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193e52">холодное</text><text x="84" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193e52">остекление</text><path d="M130 438H225" stroke="#087a9b" stroke-width="9" marker-end="url(#a)"/><text x="210" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#087a9b">Приток вдоль остекления</text><rect x="78" y="455" width="264" height="48" rx="24" fill="#81c7dc" stroke="#087a9b" stroke-width="3"/><path d="M94 451Q120 430 146 451T198 451T250 451T302 451" fill="none" stroke="#087a9b" stroke-width="3"/><text x="210" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193e52">Вода: 26–32 °C</text><text x="210" y="568" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#193e52">испарение с чаши и мокрого пола</text><path d="M340 426V200H365V130" fill="none" stroke="#c9782e" stroke-width="8" marker-end="url(#b)"/><text x="230" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#9b5922">влажный воздух</text><text x="365" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e52">вытяжка</text><rect x="42" y="620" width="336" height="74" rx="12" fill="#eaf3f6"/><text x="210" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e52">Рабочая зона</text><text x="210" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#193e52">скорость не более 0,2 м/с</text><rect x="42" y="720" width="336" height="70" rx="12" fill="#fff4e7" stroke="#c9782e" stroke-width="2"/><text x="210" y="751" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#754719">Риск конденсации</text><text x="210" y="778" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#754719">на холодных поверхностях</text><text x="210" y="840" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#193e52">Влажность задаётся проектом</text></svg>
