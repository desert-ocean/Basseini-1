<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 820" role="img" aria-labelledby="t d">
<title id="t">Байпас от нагнетания насоса к всасыванию</title><desc id="d">Насос получает воду по нижней всасывающей линии. Напорный поток делится: часть идёт к потребителю, часть через вентиль возвращается к входу насоса. Проверяйте допустимый режим по документации.</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#087a9b"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#bd742d"/></marker></defs><rect width="500" height="820" rx="20" fill="#f3f8fa"/>
<g font-family="system-ui,sans-serif" fill="#193e52"><text x="250" y="42" text-anchor="middle" font-size="23" font-weight="700">Байпас насоса</text>
<rect x="350" y="305" width="120" height="100" rx="14" fill="#fff" stroke="#447f94" stroke-width="4"/><text x="410" y="348" text-anchor="middle" font-size="16">Основной</text><text x="410" y="373" text-anchor="middle" font-size="16">потребитель</text>
<circle cx="250" cy="360" r="48" fill="#fff" stroke="#447f94" stroke-width="5"/><path d="M232 332v56l49-28z" fill="#087a9b"/><text x="250" y="430" text-anchor="middle" font-size="16" font-weight="700">Насос</text>
<path d="M298 360H350" fill="none" stroke="#087a9b" stroke-width="9" marker-end="url(#a)"/><text x="390" y="285" text-anchor="middle" font-size="15">Полезный поток</text>
<path d="M330 360V185H150V550H202V410" fill="none" stroke="#bd742d" stroke-width="8" marker-end="url(#b)"/><path d="M245 185h40" stroke="#bd742d" stroke-width="6"/><path d="M226 166l20 19-20 19M304 166l-20 19 20 19" fill="#fff7ed" stroke="#bd742d" stroke-width="4"/><text x="265" y="137" text-anchor="middle" font-size="17" font-weight="700">Регулирующий вентиль</text><text x="250" y="225" text-anchor="middle" font-size="15" fill="#9b5e21">Перепуск обратно на вход</text>
<path d="M50 550H150" fill="none" stroke="#087a9b" stroke-width="9" marker-end="url(#a)"/><text x="95" y="590" text-anchor="middle" font-size="16">Всасывание</text>
<rect x="28" y="655" width="444" height="125" rx="14" fill="#fff4e8" stroke="#e5c397"/><text x="50" y="690" font-size="17" font-weight="700" fill="#754315">Потери энергии и возможный нагрев</text><text x="50" y="722" font-size="15" fill="#754315">Сверьте минимальный расход, температуру</text><text x="50" y="748" font-size="15" fill="#754315">и допустимую схему с изготовителем.</text></g></svg>
