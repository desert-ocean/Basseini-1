<svg xmlns="http://www.w3.org/2000/svg" width="768" height="512" viewBox="0 0 768 512" role="img" aria-labelledby="title desc">
<title id="title">Гидравлические потери в трубопроводе</title>
<desc id="desc">Вода движется слева направо по трубопроводу через отвод. Над ним схематично показана убывающая линия напора, а снизу — линейные и местные потери.</desc>
<defs>
 <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7fbfd"/><stop offset=".38" stop-color="#deedf4"/><stop offset="1" stop-color="#c6dce9"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9ce6f5"/><stop offset="1" stop-color="#57bedf"/></linearGradient>
 <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#eff8fb" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M1 1 6 3.5 1 6" fill="none" stroke="#218da9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="768" height="512" fill="#ffffff"/>
<!-- open canvas, no border or outer card -->
<path d="M67 339 H702" stroke="#e9f3f7" stroke-width="2"/>
<!-- Hydraulic grade line: gradual friction loss and a localized drop at the elbow -->
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
 <path d="M104 112 L333 146 L379 165 L419 216 L662 252" stroke="#d5e7ed" stroke-width="10" opacity=".36"/>
 <path d="M104 112 L333 146 L379 165 L419 216 L662 252" stroke="#1684a5" stroke-width="3"/>
 <path d="M104 112 V278 M333 146 V268 M419 216 V268 M662 252 V278" stroke="#8ebac9" stroke-width="1.5" stroke-dasharray="5 8"/>
 <path d="M90 116 H113 M90 274 H113 M651 254 H673 M651 274 H673" stroke="#173f5c" stroke-width="1.5"/>
 <path d="M92 118 V271" stroke="#173f5c" stroke-width="1.5" stroke-dasharray="3 6"/>
</g>
<text x="106" y="91" font-family="Arial, sans-serif" fill="#214a63" font-size="19" font-weight="600">H₁</text>
<text x="651" y="235" font-family="Arial, sans-serif" fill="#214a63" font-size="19" font-weight="600">H₂</text>
<!-- pipe shadow and contour, neat S-bend to represent local resistance -->
<path d="M98 280 H320 C351 280 354 327 389 327 H678" fill="none" stroke="#b0cedc" stroke-width="67" stroke-linecap="butt" stroke-linejoin="round" opacity=".28" transform="translate(0 8)"/>
<path d="M98 280 H320 C351 280 354 327 389 327 H678" fill="none" stroke="#173d5a" stroke-width="76" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M98 280 H320 C351 280 354 327 389 327 H678" fill="none" stroke="url(#pipe)" stroke-width="70" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M98 280 H320 C351 280 354 327 389 327 H678" fill="none" stroke="url(#water)" stroke-width="46" stroke-linecap="butt" stroke-linejoin="round"/>
<!-- delicate internal flow lines -->
<g fill="none" stroke="#e9fcff" stroke-width="3" opacity=".85" stroke-linecap="round">
 <path d="M137 268 Q172 260 207 268 T272 268"/>
 <path d="M140 288 Q180 281 217 288 T282 288"/>
 <path d="M419 315 Q460 307 499 315 T578 315"/>
 <path d="M427 333 Q466 327 503 333 T580 333"/>
</g>
<!-- flow arrows -->
<g fill="none" stroke="#147fa5" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"><path d="M184 279 H243"/><path d="M462 327 H519"/><path d="M592 327 H628"/></g>
<!-- entry and exit rims -->
<ellipse cx="98" cy="280" rx="19" ry="39" fill="#d6eaf2" stroke="#173d5a" stroke-width="2.5"/>
<ellipse cx="98" cy="280" rx="12" ry="27" fill="url(#water)" stroke="#2b8eb0" stroke-width="1.5"/>
<ellipse cx="678" cy="327" rx="10" ry="38" fill="#bedbe9" stroke="#173d5a" stroke-width="2.5"/>
<ellipse cx="678" cy="327" rx="6" ry="24" fill="#68c9e3" stroke="#2087a8" stroke-width="1.2"/>
<!-- local loss is at bend, unobtrusive circle pointer -->
<path d="M355 250 L388 174 H427" fill="none" stroke="#628fa5" stroke-width="1.7" stroke-linecap="round"/>
<circle cx="355" cy="250" r="3.6" fill="#2088a7"/>
<text x="434" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#315e73">местное</text>
<text x="434" y="185" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#315e73">сопротивление</text>
<!-- concise typography at bottom -->
<g font-family="Arial, sans-serif" fill="#21475e" text-anchor="middle">
 <text x="210" y="408" font-size="17" font-weight="600">Трение в трубе</text>
 <text x="553" y="408" font-size="17" font-weight="600">Потери на повороте</text>
</g>
<g stroke="#8bb2c5" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M210 394 V366"/><path d="M553 394 V371"/></g>
<g transform="translate(284 436)"><rect x="0" y="0" width="200" height="49" rx="24.5" fill="#edf7fa" stroke="#a5cbdc" stroke-width="1.7"/><text x="100" y="31" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#173e5c" text-anchor="middle">h = hтр + hм</text></g>
</svg>
