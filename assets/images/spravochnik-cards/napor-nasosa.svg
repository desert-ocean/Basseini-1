<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="768" height="512" viewBox="0 0 768 512" role="img" aria-labelledby="ttl desc">
<title id="ttl">Как понять напор насоса — инженерная иллюстрация ALPOOL</title>
<desc id="desc">Центробежный насос и условные кривые напора насоса и сопротивления системы, пересекающиеся в рабочей точке.</desc>
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fdff"/><stop offset=".55" stop-color="#e5f2f8"/><stop offset="1" stop-color="#bdd8e9"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b6eff9"/><stop offset="1" stop-color="#55b9dd"/></linearGradient>
 <linearGradient id="motor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eaf6fb"/><stop offset="1" stop-color="#afcfe2"/></linearGradient>
 <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="7"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#238eb5" stroke-width="1.8" stroke-linejoin="round"/></marker>
</defs>
<rect width="768" height="512" fill="#ffffff"/>
