<svg xmlns="http://www.w3.org/2000/svg" width="768" height="512" viewBox="0 0 768 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfd"/>
      <stop offset="100%" stop-color="#f2f5f7"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef5f8"/>
      <stop offset="100%" stop-color="#d8e8f0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bed7"/>
      <stop offset="100%" stop-color="#7bd8e9"/>
    </linearGradient>
    <linearGradient id="waterSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31b7d2"/>
      <stop offset="100%" stop-color="#2ea9c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#9fb9c7" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#0c4a76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .line { stroke:#0c4a76; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#0c4a76; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke:#0c4a76; stroke-width:1.8; stroke-dasharray:8 7; stroke-linecap:round; }
      .label { fill:#0c4a76; font-family:Arial, Helvetica, sans-serif; font-style:italic; font-weight:700; }
      .formula { fill:#0c4a76; font-family:Arial, Helvetica, sans-serif; font-style:italic; font-weight:700; letter-spacing:0.02em; }
    </style>
  </defs>

  <rect width="768" height="512" fill="url(#bg)"/>

  <!-- pool group -->
  <g filter="url(#shadow)">
    <!-- front wall -->
    <path d="M184 285 L600 285 Q608 285 608 293 L608 396 Q608 404 600 404 L184 404 Q176 404 176 396 L176 293 Q176 285 184 285 Z" fill="url(#wall)" stroke="#0c4a76" stroke-width="2.2"/>

    <!-- top rim -->
    <path d="M176 286 L302 128 H554 L608 286" fill="#fbfcfd" stroke="#0c4a76" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- inner water plane -->
    <polygon points="224,270 308,144 532,144 572,270" fill="url(#water)" stroke="#1fa4c4" stroke-width="2"/>

    <!-- water inner side accents -->
    <polygon points="224,270 246,238 246,176 308,144 308,204 258,270" fill="url(#waterSide)" fill-opacity="0.45"/>
    <polygon points="572,270 552,238 552,176 532,144 532,204 540,270" fill="url(#waterSide)" fill-opacity="0.35"/>

    <!-- water waves -->
    <path d="M290 173 C318 161 345 185 373 173 C401 161 428 185 456 173 C484 161 511 185 538 173" stroke="#d9f5fb" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M274 220 C308 206 343 234 378 220 C413 206 448 234 483 220 C518 206 547 230 564 220" stroke="#d9f5fb" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- L dimension -->
  <line x1="300" y1="102" x2="300" y2="136" class="dash"/>
  <line x1="545" y1="102" x2="545" y2="136" class="dash"/>
  <line x1="304" y1="124" x2="541" y2="124" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="422" y="90" class="label" font-size="44" text-anchor="middle">L</text>

  <!-- W dimension -->
  <line x1="612" y1="128" x2="646" y2="128" class="dash"/>
  <line x1="605" y1="269" x2="653" y2="269" class="dash"/>
  <line x1="618" y1="133" x2="651" y2="264" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="680" y="197" class="label" font-size="44">W</text>

  <!-- h dimension -->
  <line x1="104" y1="285" x2="164" y2="285" class="dash"/>
  <line x1="104" y1="404" x2="164" y2="404" class="dash"/>
  <line x1="130" y1="290" x2="130" y2="399" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="69" y="352" class="label" font-size="44">h</text>

  <!-- formula pill -->
  <g filter="url(#shadow)">
    <rect x="256" y="444" width="256" height="60" rx="30" fill="#ecf7fa" stroke="#6fc9df" stroke-width="2.5"/>
    <text x="384" y="483" class="formula" font-size="34" text-anchor="middle">V = L × W × h</text>
  </g>
</svg>
