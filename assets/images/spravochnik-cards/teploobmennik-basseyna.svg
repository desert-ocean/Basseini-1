<svg xmlns="http://www.w3.org/2000/svg" width="768" height="512" viewBox="0 0 768 512" role="img" aria-labelledby="title desc">
<title id="title">Теплообменник бассейна — два отдельных контура</title>
<desc id="desc">Теплообменник с раздельными первичным горячим контуром и вторичным контуром воды бассейна. Стрелки показывают условное противоточное движение, передача тепла обозначена внутри аппарата. Среды не смешиваются.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f8fa"/></linearGradient>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#eaf5fa"/><stop offset="1" stop-color="#d3e8f1"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b0eaf5"/><stop offset="1" stop-color="#52c1dd"/></linearGradient>
 <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbe8ca"/><stop offset="1" stop-color="#f2b96e"/></linearGradient>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#7897a7" flood-opacity=".13"/></filter>
 <marker id="blueArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#1497bb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="orangeArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#d78a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>
  .edge{stroke:#184b68;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .pipeB{stroke:#b4e4f0;stroke-width:14;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .pipeO{stroke:#f4d7ac;stroke-width:14;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .pipeEdge{stroke:#184b68;stroke-width:1.9;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .flowB{stroke:#1497bb;stroke-width:2.9;fill:none;stroke-linecap:round;marker-end:url(#blueArrow)}
  .flowO{stroke:#d78a3c;stroke-width:2.9;fill:none;stroke-linecap:round;marker-end:url(#orangeArrow)}
  .label{font:700 18px Arial,Helvetica,sans-serif;fill:#184b68;text-anchor:middle}
  .mini{font:700 14px Arial,Helvetica,sans-serif;fill:#24536d;text-anchor:middle}
  .small{font:600 14px Arial,Helvetica,sans-serif;fill:#5d7d8e;text-anchor:middle}
 </style>
</defs>
<rect width="768" height="512" fill="url(#bg)"/>
<!-- two distinct pathways first -->
<!-- primary flow upper path: boiler right -> exchanger top right, exchanger left -> boiler, conceptual loop -->
<path d="M643 153H569V194" class="pipeO"/>
<path d="M643 153H569V194" class="pipeEdge"/>
<path d="M402 194V111H668V154" class="pipeO"/>
<path d="M402 194V111H668V154" class="pipeEdge"/>
<!-- secondary flow, pool left through exchanger and back -->
<path d="M206 336H345" class="pipeB"/>
<path d="M206 336H345" class="pipeEdge"/>
<path d="M614 336H672V421H126V337" class="pipeB"/>
<path d="M614 336H672V421H126V337" class="pipeEdge"/>
<!-- pool schematic left -->
<g filter="url(#shadow)">
 <path d="M48 236V349Q48 360 59 360H226Q237 360 237 349V236" fill="url(#shell)" class="edge"/>
 <path d="M60 252H225V343Q225 348 219 348H66Q60 348 60 343Z" fill="url(#water)"/>
 <path d="M60 251Q81 244 101 251T142 251T183 251T225 251" fill="none" stroke="#f0fcff" stroke-width="3.6"/>
 <path d="M61 277Q88 271 110 277T164 277T225 277" fill="none" stroke="#dff9fd" stroke-width="2.3" opacity=".65"/>
 <path d="M48 236H237" class="edge"/>
</g>
<text x="143" y="208" class="label">Бассейн</text>
<!-- primary source on top right -->
<g filter="url(#shadow)">
 <rect x="629" y="78" width="93" height="118" rx="16" fill="url(#shell)" class="edge"/>
 <rect x="642" y="93" width="67" height="45" rx="9" fill="#fffaf2" stroke="#edbf7a" stroke-width="1.5"/>
 <path d="M660 123C656 113 666 111 667 103C677 113 678 119 672 125" fill="none" stroke="#d58c45" stroke-width="2.9" stroke-linecap="round"/>
 <path d="M646 157H706M646 169H694" stroke="#9db9c6" stroke-width="2.2" stroke-linecap="round"/>
</g>
<text x="676" y="57" class="label">Источник</text>
<text x="676" y="73" class="small">тепла</text>
<!-- heat exchanger core -->
<g filter="url(#shadow)">
 <rect x="327" y="192" width="299" height="174" rx="76" fill="url(#shell)" class="edge"/>
 <rect x="347" y="211" width="259" height="136" rx="56" fill="#f5fbfd" stroke="#9dc5d5" stroke-width="1.7"/>
 <!-- hot tube serpentine, separate from pool side -->
 <path d="M366 249H570Q588 249 588 265Q588 281 570 281H366Q351 281 351 296Q351 312 367 312H570" fill="none" stroke="#f2bf7c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M366 249H570Q588 249 588 265Q588 281 570 281H366Q351 281 351 296Q351 312 367 312H570" fill="none" stroke="#d48b43" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
 <!-- tube bundle fins / heat transfer rays (do not connect fluids) -->
 <path d="M410 226V237M450 226V237M490 226V237M530 226V237M410 325V336M450 325V336M490 325V336M530 325V336" stroke="#66bdd3" stroke-width="2.6" stroke-linecap="round"/>
 <!-- pool water secondary motion around bundle -->
 <path d="M376 341H546" class="flowB"/>
 <path d="M570 232H391" class="flowO"/>
</g>
<text x="474" y="183" class="label">Теплообменник</text>
<!-- primary flow arrows -->
<path d="M609 153H584" class="flowO"/>
<path d="M547 111H585" class="flowO"/>
<!-- secondary flow arrows -->
<path d="M260 336H313" class="flowB"/>
<path d="M644 388V406" class="flowB"/>
<path d="M514 421H456" class="flowB"/>
<!-- labels with deliberate separate positions -->
<text x="440" y="95" class="mini">Первичный контур</text>
<text x="440" y="110" class="small">горячий теплоноситель</text>
<text x="454" y="394" class="mini">Контур воды бассейна</text>
<!-- no-mixing / transfer footer -->
<rect x="171" y="455" width="426" height="42" rx="21" fill="#edf8fa" stroke="#b6dce7" stroke-width="1.6"/>
<text x="384" y="482" class="mini">Передача тепла без смешивания сред</text>
</svg>
