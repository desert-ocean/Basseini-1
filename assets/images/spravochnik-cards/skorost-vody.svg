<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 512" width="768" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Скорость воды в трубопроводе</title>
  <desc id="desc">Светлая инженерная иллюстрация трубопровода с потоком воды, обозначением внутреннего диаметра D и формулой v = Q / A.</desc>
  <defs>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4fbff"/><stop offset=".27" stop-color="#d6eaf3"/><stop offset=".74" stop-color="#edf7fa"/><stop offset="1" stop-color="#bfd5e2"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67c3e3"/><stop offset=".52" stop-color="#a8ebf6"/><stop offset="1" stop-color="#6bc7e6"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9fdff"/><stop offset=".58" stop-color="#d8ebf2"/><stop offset="1" stop-color="#bad4e2"/></linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5fbfd"/><stop offset="1" stop-color="#e4f3f8"/></linearGradient>
  </defs>
  <!-- Airy background; no frame, no raster elements -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Pipe, filled translucent wall and moving stream -->
    <path d="M218 157H608Q627 157 627 178V315Q627 336 608 336H218Z" fill="url(#pipe)" stroke="#173d59" stroke-width="2.4"/>
    <path d="M230 191H600Q612 191 612 204V289Q612 302 600 302H230Z" fill="url(#water)"/>
    <path d="M228 190H606" fill="none" stroke="#2788b3" stroke-width="1.7" opacity=".75"/>
    <path d="M228 304H606" fill="none" stroke="#fff" stroke-width="5" opacity=".65"/>
    <path d="M233 169H602" fill="none" stroke="#fff" stroke-width="7" opacity=".72"/>
    <path d="M233 325H603" fill="none" stroke="#91b9cb" stroke-width="3" opacity=".5"/>
    <!-- Water motion, flowing right; deliberately restrained -->
    <g fill="none" stroke="#edfaff" stroke-width="2.4" opacity=".87">
      <path d="M275 222c18-9 34 9 53 0s35-9 54 0 35 9 54 0 35-9 54 0 34 9 53 0 34-9 54 0"/>
      <path d="M272 267c19-9 36 9 55 0s36-9 55 0 35 9 54 0 35-9 54 0 35 9 54 0 34-9 53 0"/>
    </g>
    <!-- Front annular cut face -->
    <ellipse cx="210" cy="247" rx="106" ry="108" fill="url(#rim)" stroke="#173d59" stroke-width="2.7"/>
    <ellipse cx="210" cy="247" rx="83" ry="85" fill="url(#water)" stroke="#173d59" stroke-width="2.3"/>
    <path d="M146 206c11 7 22-7 34 0s22 7 34 0 22-7 34 0 19 7 27 0M151 245c12-8 23-8 35 0s22 8 34 0 23-8 36 0M154 278c12-8 23-8 35 0s23 8 35 0 22-8 35 0" fill="none" stroke="#eaffff" stroke-width="2.6" opacity=".85"/>
    <path d="M144 194c18-22 45-34 75-31" fill="none" stroke="#fff" stroke-width="5" opacity=".42"/>
    <!-- Diameter dimension, referring to the *internal* cross-section -->
    <g fill="none" stroke="#173d59" stroke-width="1.8">
      <path d="M614 191h52M614 302h52" stroke-dasharray="7 6" opacity=".7"/>
      <path d="M649 196v101M644 201l5-9 5 9M644 292l5 9 5-9"/>
    </g>
    <text x="674" y="252" fill="#173d59" font-family="Arial, Helvetica, sans-serif" font-size="28" font-style="italic">D</text>
    <!-- Flow rate leader -->
    <circle cx="182" cy="273" r="3.5" fill="#173d59"/>
    <path d="M181 276l-54 66" fill="none" stroke="#173d59" stroke-width="1.8"/>
    <text x="109" y="370" fill="#173d59" font-family="Arial, Helvetica, sans-serif" font-size="29" font-style="italic">Q</text>
    <!-- Discrete travel ticks -->
    <g stroke="#287b9c" stroke-width="2.1" opacity=".85"><path d="M305 127v18M398 127v18M491 127v18M584 127v18"/></g>
    <!-- Formula -->
    <rect x="281" y="384" width="225" height="65" rx="32.5" fill="url(#tag)" stroke="#91b9cd" stroke-width="1.6"/>
    <text x="393.5" y="427" text-anchor="middle" fill="#173d59" font-family="Arial, Helvetica, sans-serif" font-size="31" font-style="italic" font-weight="600">v = Q / A</text>
  </g>
</svg>
