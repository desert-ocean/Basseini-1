<svg xmlns="http://www.w3.org/2000/svg" width="768" height="512" viewBox="0 0 768 512" role="img" aria-labelledby="title desc">
<title id="title">Автоматическая подпитка бассейна</title>
<desc id="desc">Условная схема подпитки балансной ёмкости: датчик уровня связан с контроллером, контроллер управляет электромагнитным клапаном, вода поступает через воздушный разрыв; предусмотрен независимый аварийный перелив.</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f9fb"/></linearGradient>
 <linearGradient id="tank" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fafc"/><stop offset="1" stop-color="#dceaf2"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5e9f5"/><stop offset="1" stop-color="#4cc3dd"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eef5f9"/><stop offset="1" stop-color="#bbd6e5"/></linearGradient>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#65879b" flood-opacity=".14"/></filter>
 <marker id="flowArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2 10 6 2 10" fill="none" stroke="#168aab" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></marker>
 <style>
 .outline{stroke:#164862;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
 .pipe{stroke:#164862;stroke-width:20;stroke-linejoin:round;stroke-linecap:round;fill:none}
 .pipeInner{stroke:#94e0ef;stroke-width:14;stroke-linejoin:round;stroke-linecap:round;fill:none}
 .signal{stroke:#3388a4;stroke-width:2;stroke-dasharray:6 6;fill:none;stroke-linecap:round}
 .name{font:700 18px Arial,Helvetica,sans-serif;fill:#164862}
 .small{font:600 14px Arial,Helvetica,sans-serif;fill:#476879}
 </style>
</defs>
<rect width="768" height="512" fill="url(#background)"/>
<!-- tank and its liquid -->
<g filter="url(#shadow)">
 <rect x="84" y="176" width="328" height="240" rx="18" fill="url(#tank)" stroke="#164862" stroke-width="2.5"/>
 <path d="M96 291 C120 283 141 300 165 291 S210 299 232 291 S277 300 302 291 S352 300 400 291 V401 Q400 404 394 404 H102 Q96 404 96 397Z" fill="url(#water)" opacity=".94"/>
 <path d="M103 308 C132 299 147 316 173 307 S222 317 250 306 S304 315 331 306 S365 314 393 306" stroke="#e5fbff" stroke-width="3.5" fill="none" opacity=".9"/>
</g>
<!-- level sensor probe, not falsely depicted as a pump -->
<rect x="127" y="154" width="24" height="21" rx="4" fill="url(#metal)" class="outline"/>
<path d="M139 175 V337" stroke="#245c77" stroke-width="6" stroke-linecap="round"/>
<circle cx="139" cy="291" r="10" fill="#fff" stroke="#138cae" stroke-width="3"/>
<circle cx="139" cy="291" r="4" fill="#138cae"/>
<path d="M157 294 H230" stroke="#168fb2" stroke-width="1.7" stroke-dasharray="5 6"/>
<text x="112" y="446" class="name">Балансная ёмкость</text>
<text x="112" y="467" class="small">Контроль рабочего уровня</text>
<!-- high level and overflow line with physical downward discharge -->
<path d="M411 227 H461 V319 H501" class="pipe"/>
<path d="M411 227 H461 V319 H501" class="pipeInner"/>
<path d="M471 319 H486" stroke="#168aab" stroke-width="2.6" marker-end="url(#flowArrow)"/>
<path d="M496 310 L508 310 508 332 542 332" stroke="#164862" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M514 338 H539 M519 344 H534" stroke="#7c9eb0" stroke-width="2" stroke-linecap="round"/>
<text x="479" y="365" class="small">Аварийный</text><text x="479" y="383" class="small">перелив</text>
<!-- top controller -->
<g filter="url(#shadow)">
 <rect x="268" y="42" width="174" height="94" rx="15" fill="#f3f9fc" stroke="#164862" stroke-width="2.5"/>
 <rect x="288" y="61" width="100" height="43" rx="7" fill="#e6f5f8" stroke="#9ccfdf" stroke-width="1.5"/>
 <path d="M302 87 H318 L329 76 L340 92 L352 81 L372 81" stroke="#138eac" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
 <circle cx="410" cy="75" r="7" fill="#4bc4d6" stroke="#164862" stroke-width="1.5"/>
 <circle cx="410" cy="98" r="5" fill="#c4dae5" stroke="#7aa5b7" stroke-width="1.2"/>
</g>
<text x="355" y="30" class="name" text-anchor="middle">Контроллер</text>
<!-- level-control cable to controller -->
<path d="M139 154 V94 Q139 86 148 86 H268" class="signal"/>
<!-- freshwater inlet, air gap, and solenoid on the horizontal supply pipe -->
<path d="M690 201 H586" class="pipe"/><path d="M690 201 H586" class="pipeInner"/>
<path d="M555 201 H359 V248" class="pipe"/><path d="M555 201 H359 V248" class="pipeInner"/>
<!-- solenoid depicted above valve, connected to inlet plumbing -->
<g filter="url(#shadow)">
 <path d="M555 185 L570 201 L555 217 L540 201Z" fill="#edf7fa" stroke="#164862" stroke-width="2.5" stroke-linejoin="round"/>
 <rect x="544" y="151" width="22" height="31" rx="5" fill="url(#metal)" stroke="#164862" stroke-width="2"/>
 <rect x="537" y="142" width="36" height="13" rx="3" fill="#b6dbe9" stroke="#164862" stroke-width="2"/>
</g>
<path d="M442 86 H555 V142" class="signal"/>
<path d="M662 201 H634" stroke="#168aab" stroke-width="3" marker-end="url(#flowArrow)"/>
<text x="628" y="167" class="name" text-anchor="middle">ХВС</text>
<text x="555" y="126" class="small" text-anchor="middle">Клапан</text>
<!-- gap clearly separated between spout and water level -->
<path d="M359 248 V262" stroke="#46bdd9" stroke-width="3.3" stroke-linecap="round" stroke-dasharray="5 6"/>
<path d="M349 273 Q359 285 369 273" stroke="#47c6de" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M384 256 H418" stroke="#a7c3cf" stroke-width="1.7" stroke-dasharray="4 4"/>
<text x="427" y="259" class="small">Разрыв</text><text x="427" y="278" class="small">струи</text>
<!-- small independent high-level warning indicator -->
<path d="M152 224 H178" stroke="#d9a45b" stroke-width="3" stroke-linecap="round"/>
<circle cx="189" cy="224" r="7" fill="#fff0d4" stroke="#cb9751" stroke-width="2"/>
<text x="191" y="212" class="small" text-anchor="middle">MAX</text>
</svg>
