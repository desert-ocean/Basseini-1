<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1050" role="img" aria-labelledby="t d"><title id="t">Уравнивание потенциалов у бассейна</title><desc id="d">Вертикальная схема чаши, арматуры и металлической коммуникации с проектными защитными соединениями к местной шине и PE здания; поручень не подключён автоматически.</desc><rect width="420" height="1050" rx="22" fill="#f4f9fa"/><g font-family="Arial,sans-serif" fill="#17394c"><text x="20" y="45" font-size="24" font-weight="700">Связи по проекту</text><rect x="30" y="255" width="360" height="280" rx="8" fill="#dff2f5" stroke="#43869a" stroke-width="5"/><path d="M45 290H375" stroke="#167b98" stroke-width="5"/><text x="145" y="390" font-size="22" font-weight="700">Чаша / вода</text><path d="M55 500H365" stroke="#8b6d52" stroke-width="7" stroke-dasharray="11 7"/><text x="92" y="565" font-size="17">Арматура чаши</text><rect x="40" y="90" width="155" height="94" rx="12" fill="#fff" stroke="#c78a49" stroke-width="3"/><text x="58" y="128" font-size="18" font-weight="700">Поручень</text><text x="58" y="158" font-size="15">не автоматически</text><path d="M115 184V235" stroke="#89979b" stroke-width="4" stroke-dasharray="7 7"/><rect x="225" y="90" width="155" height="94" rx="12" fill="#fff" stroke="#43869a" stroke-width="3"/><text x="241" y="128" font-size="18" font-weight="700">Металлотруба</text><text x="241" y="158" font-size="15">оценить по норме</text><path d="M300 184V220H390V630H340V760" fill="none" stroke="#278267" stroke-width="5" stroke-dasharray="10 7"/><rect x="40" y="650" width="180" height="100" rx="12" fill="#fff" stroke="#c78a49" stroke-width="3"/><text x="57" y="692" font-size="17" font-weight="700">Ниша светильника</text><text x="57" y="720" font-size="14">по проекту</text><path d="M130 650V590H70V500" fill="none" stroke="#c78a49" stroke-width="4" stroke-dasharray="7 7"/><rect x="220" y="770" width="170" height="105" rx="12" fill="#e8f5ef" stroke="#278267" stroke-width="4"/><text x="241" y="813" font-size="18" font-weight="700">Местная шина</text><text x="245" y="842" font-size="15">защитные связи</text><path d="M305 875V935H375" stroke="#278267" stroke-width="5"/><text x="30" y="960" font-size="16" font-weight="700">Связь с PE / ГЗШ здания</text><text x="30" y="1000" font-size="14">Вода и пластик не заменяют PE.</text></g></svg>