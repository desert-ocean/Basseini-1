<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Четыре разные функции обработки бассейновой воды</title>
  <desc id="desc">Фильтр физически отделяет частицы; окислитель изменяет загрязнения; дезинфектант инактивирует чувствительные микроорганизмы при заданных условиях; свободный хлор или бром оставляет защитный остаток в чаше.</desc>
  <defs><marker id="arrow-func" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147b9b"/></marker></defs>
  <rect width="1200" height="560" rx="24" fill="#f5f9fa"/>
  <text x="42" y="52" fill="#193e52" font-family="Arial,sans-serif" font-size="27" font-weight="700">Обработка воды: четыре разные функции</text>
  <g font-family="Arial,sans-serif" fill="#193e52">
    <text x="42" y="111" font-size="18" font-weight="700">ФИЗИЧЕСКОЕ УДАЛЕНИЕ</text><text x="42" y="142" font-size="16">Фильтрация</text>
    <text x="42" y="224" font-size="18" font-weight="700">ОКИСЛЕНИЕ</text><text x="42" y="255" font-size="16">Хлор, озон и другие</text>
    <text x="42" y="337" font-size="18" font-weight="700">ОБЕЗЗАРАЖИВАНИЕ</text><text x="42" y="368" font-size="16">Хлор, бром, УФ, озон</text>
    <text x="42" y="450" font-size="18" font-weight="700">ОСТАТОЧНАЯ ЗАЩИТА</text><text x="42" y="481" font-size="16">Хлор или бром в чаше</text>
  </g>
  <g stroke="#c4d8df" stroke-width="2"><path d="M300 80H1150M300 193H1150M300 306H1150M300 419H1150M300 532H1150"/></g>
  <g font-family="Arial,sans-serif" font-size="16" text-anchor="middle">
    <rect x="325" y="92" width="205" height="58" rx="12" fill="#e5f1f4" stroke="#147b9b" stroke-width="2"/><text x="427" y="127" fill="#193e52">частицы и взвесь</text>
    <path d="M542 121H625" stroke="#147b9b" stroke-width="3" marker-end="url(#arrow-func)"/><rect x="640" y="92" width="205" height="58" rx="12" fill="#fff" stroke="#147b9b" stroke-width="2"/><text x="742" y="127" fill="#193e52">фильтрующий слой</text>
    <path d="M857 121H932" stroke="#147b9b" stroke-width="3" marker-end="url(#arrow-func)"/><rect x="946" y="92" width="205" height="58" rx="12" fill="#e5f1f4" stroke="#147b9b" stroke-width="2"/><text x="1048" y="127" fill="#193e52">часть частиц удалена</text>

    <rect x="325" y="205" width="205" height="58" rx="12" fill="#fff3df" stroke="#bc7728" stroke-width="2"/><text x="427" y="240" fill="#193e52">органические вещества</text>
    <path d="M542 234H625" stroke="#bc7728" stroke-width="3" marker-end="url(#arrow-func)"/><rect x="640" y="205" width="205" height="58" rx="12" fill="#fff" stroke="#bc7728" stroke-width="2"/><text x="742" y="240" fill="#193e52">реакция окисления</text>
    <path d="M857 234H932" stroke="#bc7728" stroke-width="3" marker-end="url(#arrow-func)"/><rect x="946" y="205" width="205" height="58" rx="12" fill="#fff3df" stroke="#bc7728" stroke-width="2"/><text x="1048" y="240" fill="#193e52">состав изменён*</text>

    <rect x="325" y="318" width="205" height="58" rx="12" fill="#f0eafd" stroke="#7054a1" stroke-width="2"/><text x="427" y="353" fill="#193e52">микроорганизмы</text>
    <path d="M542 347H625" stroke="#7054a1" stroke-width="3" marker-end="url(#arrow-func)"/><rect x="640" y="318" width="205" height="58" rx="12" fill="#fff" stroke="#7054a1" stroke-width="2"/><text x="742" y="353" fill="#193e52">доза × контакт</text>
    <path d="M857 347H932" stroke="#7054a1" stroke-width="3" marker-end="url(#arrow-func)"/><rect x="946" y="318" width="205" height="58" rx="12" fill="#f0eafd" stroke="#7054a1" stroke-width="2"/><text x="1048" y="353" fill="#193e52">инактивация*</text>

    <rect x="325" y="431" width="205" height="58" rx="12" fill="#e6f4eb" stroke="#398358" stroke-width="2"/><text x="427" y="466" fill="#193e52">чаша бассейна</text>
    <path d="M542 460H625" stroke="#398358" stroke-width="3" marker-end="url(#arrow-func)"/><rect x="640" y="431" width="205" height="58" rx="12" fill="#fff" stroke="#398358" stroke-width="2"/><text x="742" y="466" fill="#193e52">свободный хлор / бром</text>
    <path d="M857 460H932" stroke="#398358" stroke-width="3" marker-end="url(#arrow-func)"/><rect x="946" y="431" width="205" height="58" rx="12" fill="#e6f4eb" stroke="#398358" stroke-width="2"/><text x="1048" y="466" fill="#193e52">барьер при новом заносе</text>
  </g>
  <text x="325" y="520" fill="#516d79" font-family="Arial,sans-serif" font-size="14">* Результат зависит от вещества, микроорганизма, концентрации, времени, pH, температуры и качества воды.</text>
</svg>
