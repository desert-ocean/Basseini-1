<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Свободный, связанный и общий хлор в бассейне</title><desc id="desc">Свободный хлор 1,0 мг/л плюс связанный хлор 0,4 мг/л дают общий хлор 1,4 мг/л. Связанный хлор определяют как разницу общего и свободного.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#15334a} .muted{fill:#5c7487}.white{fill:#fff}.navy{fill:#103750}.bold{font-weight:700}.fine{font-size:15px}.small{font-size:17px}.body{font-size:20px}.head{font-size:28px;font-weight:700}.big{font-size:40px;font-weight:700}</style><rect x="0" y="0" width="1200" height="650" rx="26" fill="#f2f8fb"/><rect x="32" y="30" width="1136" height="590" rx="24" fill="#fff" stroke="#dce9f1" stroke-width="1.5"/><text x="70" y="83" class="muted bold" font-size="16">СВОБОДНЫЙ И СВЯЗАННЫЙ ХЛОР</text><text x="70" y="130" class="head" font-size="34">Что показывает анализ воды</text><text x="70" y="164" class="muted" font-size="19">Общий хлор складывается из двух измеряемых составляющих</text><rect x="70" y="202" width="290" height="165" rx="20" fill="#e5f5fa"/><rect x="70" y="202" width="7" height="165" rx="3" fill="#097f9c"/><text x="90" y="243" class="bold" font-size="23">Свободный хлор</text><text x="90" y="294" class="big" font-size="37">1,0 мг/л</text><text x="90" y="337" class="muted" font-size="15">Участвует в обеззараживании</text><rect x="457" y="202" width="290" height="165" rx="20" fill="#fff2de"/><rect x="457" y="202" width="7" height="165" rx="3" fill="#b76b16"/><text x="477" y="243" class="bold" font-size="23">Связанный хлор</text><text x="477" y="294" class="big" font-size="37">0,4 мг/л</text><text x="477" y="337" class="muted" font-size="15">Включает хлорамины</text><rect x="844" y="202" width="290" height="165" rx="20" fill="#e9effd"/><rect x="844" y="202" width="7" height="165" rx="3" fill="#395fc5"/><text x="864" y="243" class="bold" font-size="23">Общий хлор</text><text x="864" y="294" class="big" font-size="37">1,4 мг/л</text><text x="864" y="337" class="muted" font-size="15">Сумма двух показателей</text><text x="404" y="302" class="bold" font-size="42" text-anchor="middle">+</text><text x="791" y="302" class="bold" font-size="42" text-anchor="middle">=</text><text x="70" y="418" class="bold" font-size="22">Пример расчёта связанного хлора</text><text x="70" y="455" class="muted" font-size="20">Общий − свободный = связанный</text><rect x="70" y="477" width="1060" height="49" rx="13" fill="#e9effd"/><rect x="70" y="477" width="757" height="49" rx="13" fill="#22a5bc"/><rect x="807" y="477" width="20" height="49" rx="0" fill="#22a5bc"/><rect x="827" y="477" width="303" height="49" rx="0" fill="#efae4d"/><text x="446" y="509" class="white bold" font-size="19" text-anchor="middle">1,0 мг/л</text><text x="977" y="509" class="navy bold" font-size="19" text-anchor="middle">0,4 мг/л</text><text x="70" y="565" class="bold" font-size="23">1,4 − 1,0 = 0,4 мг/л</text><text x="1130" y="566" class="muted" font-size="16" text-anchor="end">Единицы: мг/л Cl₂</text><text x="70" y="601" class="muted" font-size="16">Пример условный. Для расчёта нужны сопоставимые измерения одной пробы.</text></svg>