<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1510" viewBox="0 0 780 1510" role="img" aria-labelledby="title desc">
  <title id="title">Раскладка восьми донных форсунок в бассейне 10 на 5 метров</title>
  <desc id="desc">План прямоугольной чаши 10 на 5 метров: восемь подающих форсунок расположены в четыре колонки и два ряда. Межосевой шаг 2,5 метра, краевые отступы по 1,25 метра. Значения — проектный ориентир, не норматив.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9f3fa"/><stop offset="1" stop-color="#eefaff"/></linearGradient>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#557888"/></marker>
  </defs>
  <style>
    text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#193e52}
    .title{font-size:36px;font-weight:700}.subtitle{font-size:27px;fill:#516d79}
    .heading{font-size:29px;font-weight:700}.body{font-size:27px}.label{font-size:26px;font-weight:700}
    .value{font-size:38px;font-weight:700;fill:#075b7c}.note{font-size:25px;fill:#516d79}
  </style>
  <rect x="2" y="2" width="776" height="1506" rx="30" fill="#f8fcfd" stroke="#d4e2e8" stroke-width="4"/>
  <text x="38" y="66" class="title">Донные подающие форсунки</text>
  <text x="38" y="112" class="subtitle">Предварительная сетка в чаше 10 × 5 м</text>

  <rect x="28" y="150" width="724" height="900" rx="24" fill="#fff" stroke="#d4e2e8" stroke-width="3"/>
  <text x="58" y="204" class="heading">Вид сверху</text>
  <!-- Pool plan: 10:5 aspect ratio, eight outlets in a 4 x 2 grid. -->
  <rect x="86" y="332" width="592" height="296" rx="16" fill="url(#water)" stroke="#2594b5" stroke-width="6"/>
  <g stroke="#84cadd" stroke-width="3" stroke-dasharray="10 9" fill="none">
    <path d="M160 332V628M308 332V628M456 332V628M604 332V628M86 406H678M86 554H678"/>
  </g>
  <g fill="#087ea8" stroke="#fff" stroke-width="6">
    <circle cx="160" cy="406" r="20"/><circle cx="308" cy="406" r="20"/><circle cx="456" cy="406" r="20"/><circle cx="604" cy="406" r="20"/>
    <circle cx="160" cy="554" r="20"/><circle cx="308" cy="554" r="20"/><circle cx="456" cy="554" r="20"/><circle cx="604" cy="554" r="20"/>
  </g>
  <!-- Overall dimensions -->
  <path d="M86 300V268M678 300V268M86 278H678" fill="none" stroke="#557888" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <rect x="336" y="244" width="94" height="46" rx="12" fill="#fff"/>
  <text x="383" y="278" text-anchor="middle" class="label">10 м</text>
  <path d="M700 332H724M700 628H724M714 332V628" fill="none" stroke="#557888" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <rect x="683" y="452" width="64" height="48" rx="10" fill="#fff"/>
  <text x="715" y="484" text-anchor="middle" class="label">5 м</text>
  <!-- Axis pitch in both directions -->
  <path d="M160 366V346M308 366V346M160 354H308" fill="none" stroke="#557888" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <rect x="203" y="328" width="66" height="42" rx="9" fill="#fff"/>
  <text x="236" y="357" text-anchor="middle" class="label">2,5 м</text>
  <path d="M122 406H140M122 554H140M130 406V554" fill="none" stroke="#557888" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <rect x="91" y="458" width="78" height="44" rx="9" fill="#fff"/>
  <text x="130" y="489" text-anchor="middle" class="label">2,5 м</text>

  <rect x="58" y="688" width="664" height="190" rx="18" fill="#eaf6fa" stroke="#cce4ec" stroke-width="3"/>
  <text x="88" y="738" class="heading">8 точек подачи</text>
  <text x="88" y="778" class="body">4 колонки × 2 ряда</text>
  <text x="88" y="829" class="heading">Шаг по осям</text>
  <text x="88" y="867" class="body">2,5 м в обоих направлениях</text>

  <text x="58" y="936" class="heading">Отступы от стен</text>
  <path d="M112 982H184" stroke="#557888" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="218" y="991" class="value">1,25 м</text>
  <text x="408" y="984" class="body">до оси крайнего ряда</text>
  <text x="58" y="1042" class="note">Шаг и отступы показаны между осями точек.</text>

  <rect x="28" y="1078" width="724" height="390" rx="24" fill="#fff" stroke="#d4e2e8" stroke-width="3"/>
  <text x="58" y="1132" class="heading">Как читать пример</text>
  <text x="58" y="1192" class="body">Размер чаши: 10 × 5 м</text>
  <text x="58" y="1242" class="body">Раскладка: 4 × 2 = 8 форсунок</text>
  <text x="58" y="1292" class="body">Межосевой шаг: 2,5 м</text>
  <text x="58" y="1342" class="body">Краевой отступ: около 1,25 м</text>
  <text x="58" y="1400" class="note">2,5 м — ориентир ALPOOL, не норма.</text>
  <text x="58" y="1440" class="note">Проверьте расход и характеристики выбранной модели.</text>
</svg>
