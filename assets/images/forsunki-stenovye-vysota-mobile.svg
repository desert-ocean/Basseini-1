<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1420" viewBox="0 0 780 1420" role="img" aria-labelledby="title desc">
  <title id="title">Высота установки стеновой подающей форсунки</title>
  <desc id="desc">Вертикальная схема показывает рабочий уровень воды, ось стеновой форсунки, направление потока в чашу и ориентир глубины установки 200–400 миллиметров. Это инженерная рекомендация, не норматив.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9f3fa"/><stop offset="1" stop-color="#eefaff"/></linearGradient>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#557888"/></marker>
  </defs>
  <style>
    text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#193e52}
    .title{font-size:36px;font-weight:700}.subtitle{font-size:27px;fill:#516d79}
    .heading{font-size:29px;font-weight:700}.body{font-size:27px}.small{font-size:25px}
    .value{font-size:38px;font-weight:700;fill:#075b7c}.note{font-size:25px;fill:#516d79}
  </style>
  <rect x="2" y="2" width="776" height="1416" rx="30" fill="#f8fcfd" stroke="#d4e2e8" stroke-width="4"/>
  <text x="38" y="66" class="title">Стеновая подающая форсунка</text>
  <text x="38" y="112" class="subtitle">Высота от уровня воды до оси</text>

  <rect x="28" y="150" width="724" height="710" rx="24" fill="#fff" stroke="#d4e2e8" stroke-width="3"/>
  <text x="58" y="204" class="heading">Разрез чаши</text>

  <!-- Pool section; the right wall contains the inlet. -->
  <path d="M112 286V690Q112 720 142 720H622V286" fill="none" stroke="#829ba9" stroke-width="20" stroke-linejoin="round"/>
  <rect x="123" y="292" width="488" height="416" fill="url(#water)"/>
  <path d="M123 292H611" stroke="#1a95bd" stroke-width="7"/>
  <path d="M133 306Q174 297 215 306T297 306T379 306T461 306T543 306T605 306" fill="none" stroke="#65bfd9" stroke-width="3"/>
  <rect x="146" y="224" width="424" height="48" rx="12" fill="#edf7fa"/>
  <text x="358" y="257" text-anchor="middle" class="body" font-weight="700">РАБОЧИЙ УРОВЕНЬ ВОДЫ</text>
  <path d="M650 296H690M650 466H690M677 304V458" fill="none" stroke="#557888" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <circle cx="611" cy="466" r="10" fill="#087eaa" stroke="#fff" stroke-width="4"/>
  <!-- Wall fitting and centerline -->
  <rect x="610" y="439" width="44" height="54" rx="7" fill="#718c9b" stroke="#436777" stroke-width="4"/>
  <path d="M610 466H552" stroke="#087eaa" stroke-width="13"/>
  <path d="M552 448L526 466L552 484Z" fill="#087eaa"/>
  <path d="M585 455Q518 413 452 422M585 477Q518 519 452 510" fill="none" stroke="#55bdd5" stroke-width="5"/>
  <path d="M453 411L433 422L454 433Z M453 499L433 510L454 521Z" fill="#55bdd5"/>
  <text x="360" y="580" text-anchor="middle" class="body">Струя направлена в чашу</text>
  <text x="360" y="625" text-anchor="middle" class="small">Ось — центр отверстия форсунки</text>
  <text x="358" y="779" text-anchor="middle" class="small">Схема условная, не в масштабе</text>

  <rect x="28" y="888" width="724" height="210" rx="24" fill="#eaf6fa" stroke="#cce4ec" stroke-width="3"/>
  <text x="58" y="943" class="heading">Предварительный ориентир</text>
  <text x="58" y="1000" class="value">200–400 мм</text>
  <text x="58" y="1045" class="body">ниже рабочего уровня воды до оси</text>

  <rect x="28" y="1126" width="724" height="252" rx="24" fill="#fff" stroke="#d4e2e8" stroke-width="3"/>
  <text x="58" y="1180" class="heading">Важно при проектировании</text>
  <text x="58" y="1230" class="small">• Глубину измеряют от зеркала воды, не от борта.</text>
  <text x="58" y="1276" class="small">• Направление струи сверяют с планом циркуляции.</text>
  <text x="58" y="1322" class="small">• Высота зависит от чаши и выбранной форсунки.</text>
  <text x="58" y="1360" class="note">200–400 мм — инженерный ориентир, не норма.</text>
</svg>
