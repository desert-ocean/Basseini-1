<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<defs>
<style>
.t1 { font-family: Arial, 'DejaVu Sans', sans-serif; font-weight: 800; fill: #0d224a; }
.t2 { font-family: Arial, 'DejaVu Sans', sans-serif; font-weight: 700; fill: #0d224a; }
.t3 { font-family: Arial, 'DejaVu Sans', sans-serif; font-weight: 400; fill: #314a72; }
.tw { font-family: Arial, 'DejaVu Sans', sans-serif; font-weight: 700; fill: white; }
</style>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#118f99"/>
</marker>
<linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#d8f2f7"/>
  <stop offset="100%" stop-color="#c2edf2"/>
</linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#13929a"/>
  <stop offset="100%" stop-color="#0b8d94"/>
</linearGradient>
</defs>
<rect width="1280" height="760" fill="white"/>
<text x="640.0" y="64" class="t1" font-size="46" text-anchor="middle">Коагуляция воды в бассейне</text><text x="640.0" y="108" class="t3" font-size="26" text-anchor="middle">Как мелкие частицы объединяются в хлопья и затем задерживаются фильтром</text><rect x="20" y="140" width="1240" height="250" rx="20" fill="#f8fdfe" stroke="#52b8c0" stroke-width="2"/><rect x="20" y="140" width="1240" height="50" rx="20" fill="url(#head)" stroke="#52b8c0" stroke-width="2"/><text x="44" y="176" class="t1" font-size="28" text-anchor="start">Как работает коагуляция</text><circle cx="120" cy="255" r="8" fill="#e0a04c"/><circle cx="150" cy="235" r="6" fill="#e0a04c"/><circle cx="152" cy="283" r="7" fill="#e0a04c"/><circle cx="94" cy="273" r="6" fill="#e0a04c"/><circle cx="86" cy="231" r="5" fill="#e0a04c"/><text x="120" y="338" class="t2" font-size="18" text-anchor="middle"><tspan x="120" dy="0">1. Мелкие частицы</tspan><tspan x="120" dy="22">могут пройти</tspan><tspan x="120" dy="22">сквозь загрузку</tspan></text><line x1="220" y1="238" x2="355" y2="238" stroke="#118f99" stroke-width="8" marker-end="url(#arr)"/><rect x="388" y="198" width="86" height="92" rx="16" fill="#d8f2f7" stroke="#397d98" stroke-width="5"/><rect x="417" y="174" width="28" height="28" rx="8" fill="#d8f2f7" stroke="#397d98" stroke-width="5"/><circle cx="431" cy="245" r="18" fill="none" stroke="#118f99" stroke-width="5"/><path d="M 431 227 L 431 263 M 413 245 L 449 245" stroke="#118f99" stroke-width="5"/><text x="431" y="338" class="t2" font-size="18" text-anchor="middle"><tspan x="431" dy="0">2. Коагулянт</tspan><tspan x="431" dy="22">снижает устойчивость</tspan><tspan x="431" dy="22">мелких частиц</tspan></text><line x1="500" y1="238" x2="640" y2="238" stroke="#118f99" stroke-width="8" marker-end="url(#arr)"/><circle cx="734" cy="250" r="24" fill="#e0a04c"/><circle cx="764" cy="228" r="16" fill="#e0a04c"/><circle cx="770" cy="272" r="18" fill="#e0a04c"/><circle cx="720" cy="270" r="14" fill="#e0a04c"/><text x="748" y="338" class="t2" font-size="18" text-anchor="middle"><tspan x="748" dy="0">3. Частицы собираются</tspan><tspan x="748" dy="22">в крупные хлопья</tspan><tspan x="748" dy="22">— агрегаты</tspan></text><line x1="838" y1="238" x2="990" y2="238" stroke="#118f99" stroke-width="8" marker-end="url(#arr)"/><rect x="1040" y="178" width="96" height="124" rx="14" fill="none" stroke="#397d98" stroke-width="6"/><line x1="1058" y1="204" x2="1118" y2="204" stroke="#397d98" stroke-width="6"/><line x1="1058" y1="228" x2="1118" y2="228" stroke="#397d98" stroke-width="6"/><line x1="1058" y1="252" x2="1118" y2="252" stroke="#397d98" stroke-width="6"/><line x1="1058" y1="276" x2="1118" y2="276" stroke="#397d98" stroke-width="6"/><text x="1088" y="338" class="t2" font-size="18" text-anchor="middle"><tspan x="1088" dy="0">4. Фильтр задерживает</tspan><tspan x="1088" dy="22">укрупнённые частицы</tspan><tspan x="1088" dy="22">в загрузке</tspan></text><rect x="20" y="414" width="1240" height="180" rx="20" fill="#f8fdfe" stroke="#52b8c0" stroke-width="2"/><rect x="20" y="414" width="1240" height="50" rx="20" fill="url(#head)" stroke="#52b8c0" stroke-width="2"/><text x="44" y="450" class="t1" font-size="28" text-anchor="start">Что важно помнить</text><text x="42" y="488" class="t2" font-size="22" text-anchor="start"><tspan x="42" dy="0">Коагуляция не заменяет фильтр</tspan></text><text x="42" y="522" class="t3" font-size="18" text-anchor="start"><tspan x="42" dy="0">Она помогает фильтру</tspan><tspan x="42" dy="24">уловить мелкие загрязнения</tspan></text><line x1="423" y1="486" x2="423" y2="566" stroke="#9fd7dd" stroke-width="2"/><text x="447" y="488" class="t2" font-size="22" text-anchor="start"><tspan x="447" dy="0">Нужна при мелкой взвеси</tspan></text><text x="447" y="522" class="t3" font-size="18" text-anchor="start"><tspan x="447" dy="0">Особенно когда вода мутная,</tspan><tspan x="447" dy="24">но обычная фильтрация не справляется</tspan></text><line x1="828" y1="486" x2="828" y2="566" stroke="#9fd7dd" stroke-width="2"/><text x="852" y="488" class="t2" font-size="22" text-anchor="start"><tspan x="852" dy="0">Избыток реагента вреден</tspan></text><text x="852" y="522" class="t3" font-size="18" text-anchor="start"><tspan x="852" dy="0">Передозировка может ухудшить</tspan><tspan x="852" dy="24">качество воды и работу фильтра</tspan></text><rect x="20" y="618" width="1240" height="96" rx="22" fill="url(#banner)"/><circle cx="72" cy="666" r="28" fill="#fff" opacity="0.96"/><path d="M 58 666 l 10 10 l 18 -22" fill="none" stroke="#118f99" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="652" class="tw" font-size="24" text-anchor="start"><tspan x="122" dy="0">Главная идея: коагуляция нужна не для «волшебной очистки» воды,</tspan><tspan x="122" dy="30">а для укрупнения мелких загрязнений перед фильтрацией.</tspan></text></svg>