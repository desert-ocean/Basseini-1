<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">Один большой фильтр или два параллельных</title>
  <desc id="desc">На мобильной схеме сравниваются один крупный корпус и два меньших фильтра в параллельных ветвях с разделением и объединением потока.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#087a9b"/></marker></defs>
  <rect width="720" height="1120" rx="24" fill="#f4f9fa"/>
  <rect x="24" y="24" width="672" height="474" rx="20" fill="#fff" stroke="#cbdde4" stroke-width="2"/>
  <text x="360" y="75" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="28" font-weight="800">ОДИН КРУПНЫЙ ФИЛЬТР</text>
  <path d="M85 190H235M485 190H635" fill="none" stroke="#087a9b" stroke-width="9" marker-end="url(#arrow)"/>
  <text x="160" y="157" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="20" font-weight="700">общий расход Q</text>
  <rect x="250" y="123" width="220" height="155" rx="30" fill="#eaf5f7" stroke="#447f94" stroke-width="5"/>
  <path d="M264 226H456V253Q456 265 444 265H276Q264 265 264 253Z" fill="#d8b36b"/>
  <text x="360" y="187" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="26" font-weight="800">ФИЛЬТР</text>
  <text x="360" y="314" text-anchor="middle" fill="#516d79" font-family="system-ui,sans-serif" font-size="20">корпус большего диаметра</text>
  <rect x="55" y="355" width="610" height="104" rx="14" fill="#edf5f7"/>
  <text x="360" y="397" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="21" font-weight="700">Проверьте, пройдёт ли корпус</text>
  <text x="360" y="431" text-anchor="middle" fill="#516d79" font-family="system-ui,sans-serif" font-size="20">через двери и повороты техпомещения</text>
  <rect x="24" y="526" width="672" height="570" rx="20" fill="#fff" stroke="#cbdde4" stroke-width="2"/>
  <text x="360" y="580" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="27" font-weight="800">ДВА МЕНЬШИХ ПАРАЛЛЕЛЬНО</text>
  <path d="M80 738H169M169 676V802M169 676H244M169 802H244M476 676H550V738H640M476 802H550" fill="none" stroke="#087a9b" stroke-width="7"/>
  <path d="M84 738H132" fill="none" stroke="#087a9b" stroke-width="4" marker-end="url(#arrow)"/><path d="M179 676H228M179 802H228" fill="none" stroke="#087a9b" stroke-width="4" marker-end="url(#arrow)"/><path d="M486 676H520M486 802H520" fill="none" stroke="#087a9b" stroke-width="4" marker-end="url(#arrow)"/><path d="M570 738H630" fill="none" stroke="#087a9b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="120" y="705" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Q</text>
  <rect x="248" y="633" width="225" height="83" rx="16" fill="#eaf5f7" stroke="#447f94" stroke-width="4"/>
  <rect x="248" y="760" width="225" height="83" rx="16" fill="#eaf5f7" stroke="#447f94" stroke-width="4"/>
  <path d="M262 692H459V705H262Z" fill="#d8b36b"/><path d="M262 819H459V832H262Z" fill="#d8b36b"/>
  <text x="360" y="670" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="21" font-weight="800">ФИЛЬТР 1 · Q₁</text>
  <text x="360" y="797" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="21" font-weight="800">ФИЛЬТР 2 · Q₂</text>
  <text x="620" y="705" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Q₁ + Q₂</text>
  <text x="360" y="890" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Проще доставка и отдельное обслуживание</text>
  <text x="360" y="925" text-anchor="middle" fill="#516d79" font-family="system-ui,sans-serif" font-size="19">если проёмы и схема помещения ограничены</text>
  <text x="360" y="1000" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Расход между ветвями проверяют расчётом</text>
  <text x="360" y="1033" text-anchor="middle" fill="#516d79" font-family="system-ui,sans-serif" font-size="18">по насосу, коллекторам и сопротивлениям</text>
</svg>
