<text x="84" y="511" font-family="Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#12314d">Объединённая всасывающая линия</text>
<text x="1040" y="511" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#087c9b">К насосной системе</text>
