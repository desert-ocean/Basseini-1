<circle cx="89" cy="607" r="19" fill="#e8f6f9" stroke="#087c9b" stroke-width="1.5"/>
<text x="89" y="613" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#087c9b">01</text>
<text x="120" y="614" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#12314d">Забор воды</text>
<text x="72" y="652" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#597184">Вода поступает через решётку</text>
<text x="72" y="675" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#597184">в корпус донного водозабора.</text>
<rect x="450" y="570" width="380" height="139" rx="16" fill="white" stroke="#c6dfea" stroke-width="1.4"/>
<circle cx="489" cy="607" r="19" fill="#e8f6f9" stroke="#087c9b" stroke-width="1.5"/>
<text x="489" y="613" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#087c9b">02</text>
<text x="520" y="614" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#12314d">Гидравлика</text>
<text x="472" y="652" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#597184">Расход и сечение труб</text>
<text x="472" y="675" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#597184">определяются расчётом.</text>
<rect x="850" y="570" width="380" height="139" rx="16" fill="white" stroke="#c6dfea" stroke-width="1.4"/>
<circle cx="889" cy="607" r="19" fill="#e8f6f9" stroke="#087c9b" stroke-width="1.5"/>
<text x="889" y="613" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#087c9b">03</text>
<text x="920" y="614" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#12314d">Безопасность</text>
<text x="872" y="652" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#597184">Крышки и схема защиты от</text>
<text x="872" y="675" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#597184">присасывания обязательны.</text>
<rect x="50" y="724" width="1180" height="57" rx="14" fill="#e7f0f4" stroke="none" stroke-width="1"/>
<text x="75" y="747" font-family="Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#12314d">Важно: схема условная, не для монтажа. Нельзя эксплуатировать слив без исправной закреплённой крышки.</text>
<text x="75" y="769" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#597184">Количество водозаборов, их соединение и защитные устройства подбирают по проекту.</text>
