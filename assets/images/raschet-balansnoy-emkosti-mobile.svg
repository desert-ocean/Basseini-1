й лоток</text><path d="M325 64 L318 110" fill="none" stroke="#4b6173" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="455" y="100" width="235" height="285" rx="7" fill="#ffffff" stroke="#102747" stroke-width="4"/><rect x="463" y="178" width="219" height="199" rx="0" fill="#b0ecf6" stroke="none" stroke-width="2"/><rect x="463" y="226" width="219" height="151" rx="0" fill="#2eb8dc" stroke="none" stroke-width="2"/><path d="M463 226 q22 -10 44 0 t44 0 t44 0 t44 0" fill="none" stroke="#03b9de" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M471 170 h203" fill="none" stroke="#0874b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><rect x="411" y="152" width="58" height="28" rx="4" fill="white" stroke="#0874b5" stroke-width="1.5"/><text x="440" y="172" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#102747" text-anchor="middle">MAX</text><path d="M471 242 h203" fill="none" stroke="#0874b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><rect x="411" y="224" width="58" height="28" rx="4" fill="white" stroke="#0874b5" stroke-width="1.5"/><text x="440" y="244" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#102747" text-anchor="middle">РАБ.</text><path d="M471 352 h203" fill="none" stroke="#0874b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><rect x="411" y="334" width="58" height="28" rx="4" fill="white" stroke="#0874b5" stroke-width="1.5"/><text x="440" y="354" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#102747" text-anchor="middle">MIN</text><text x="572.5" y="310" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="middle">Балансная</text><text x="572.5" y="341" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight