ke-linejoin="round"/><path d="M140 1067 v107" fill="none" stroke="#03b9de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="1097" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#102747" text-anchor="start">Промывка фильтров</text><text x="160" y="1132" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#102747" text-anchor="start">если запас берётся из балансной ёмкости</text><rect x="30" y="1208" width="720" height="139" rx="13" fill="#f3fbfe" stroke="#b0dbe9" stroke-width="2"/><path d="M89 1243.5 L118 1255.5 L114 1290.5 Q103 1306.5 89 1312.5 Q69 1302.5 61 1286.5 L60 1255.5 Z" fill="#d9f9f5" stroke="#0874b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M73 1278.5 l12 11 l22 -26" fill="none" stroke="#038c97" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 1224 v107" fill="none" stroke="#03b9de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="1254" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#102747" text-anchor="start">Эксплуатационный резерв</text><text x="160" y="1289" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#102747" text-anchor="start">учёт колебаний и особенностей системы</text><rect x="30" y="1385" width="720" height="89" rx="15" fill="#0874b5" stroke="none" stroke-width="2"/><text x="390" y="1440" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">Vбал = Vвытесн + Vволн + Vраб + Vпром + Vрез</text><text x="390" y="1507" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#4b6173" text-anchor="middle">Объём проверяют по режимам работы и уровням автоматики.</text></svg>