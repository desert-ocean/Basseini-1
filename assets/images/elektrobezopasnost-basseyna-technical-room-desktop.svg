<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Защитные соединения в техническом помещении бассейна</title><desc id="d">Насос, фильтр, теплообменник и шкаф показаны с раздельными технологическими трубами и защитными проводниками к местной шине, связанной с PE и главной заземляющей шиной.</desc><rect width="1200" height="650" rx="24" fill="#f4f9fa"/><g font-family="Arial,sans-serif" fill="#17394c"><text x="35" y="52" font-size="30" font-weight="700">Функциональный пример защитной сети техпомещения</text><rect x="70" y="130" width="1050" height="350" rx="18" fill="#fff" stroke="#d5e6ea" stroke-width="3"/><path d="M120 380H1040" stroke="#167b98" stroke-width="10"/><path d="M120 370l18 10-18 10m260-20 18 10-18 10m260-20 18 10-18 10m260-20 18 10-18 10" fill="none" stroke="#fff" stroke-width="4"/><text x="390" y="427" font-size="18">Технологическая линия воды</text><g fill="#fff" stroke="#43869a" stroke-width="4"><rect x="120" y="220" width="180" height="110" rx="14"/><rect x="380" y="205" width="180" height="125" rx="14"/><rect x="640" y="220" width="180" height="110" rx="14"/><rect x="900" y="205" width="170" height="125" rx="14"/></g><g font-size="20" font-weight="700" text-anchor="middle"><text x="210" y="282">Насос</text><text x="470" y="273">Фильтр</text><text x="730" y="282">Теплообменник</text><text x="985" y="260">Шкаф</text><text x="985" y="291">управления</text></g><g fill="none" stroke="#278267" stroke-width="5"><path d="M210 330V525M470 330V525M730 330V525M985 330V525M210 525H985"/><path d="M985 525H1090V570"/></g><rect x="420" y="500" width="360" height="75" rx="12" fill="#e8f5ef" stroke="#278267" stroke-width="4"/><text x="462" y="546" font-size="22" font-weight="700">Местная защитная шина</text><path d="M780 538H1090" stroke="#278267" stroke-width="5"/><rect x="930" y="570" width="210" height="60" rx="10" fill="#fff" stroke="#278267" stroke-width="3"/><text x="956" y="608" font-size="18" font-weight="700">PE / ГЗШ здания</text><text x="95" y="605" font-size="17">Условно: соединяют только части, подлежащие защите; трубы воды не используют вместо PE.</text></g></svg>