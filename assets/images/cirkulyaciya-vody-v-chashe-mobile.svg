<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1120" viewBox="0 0 440 1120" role="img" aria-labelledby="title desc"><title id="title">Циркуляция воды в чаше бассейна</title><desc id="desc">Схема забора воды из бассейна, прохождения водоподготовки и возврата через форсунки. Пояснения о равномерном перемешивании.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#087F91"/></marker><marker id="arrowWhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#FFFFFF"/></marker></defs><rect width="440" height="1120" fill="#FFFFFF"/><text x="220" y="47" text-anchor="middle" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700">Циркуляция воды</text><text x="220" y="79" text-anchor="middle" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700">в чаше бассейна</text><rect x="22" y="108" width="396" height="218" rx="20" fill="#DDF3F6" stroke="#8BC7D3" stroke-width="2"/><path d="M40 155 Q64 143 88 155 T136 155 T184 155 T232 155 T280 155 T328 155 T400 155" fill="none" stroke="#4EC0CF" stroke-width="3"/><text x="44" y="140" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">ЧАША БАССЕЙНА</text><rect x="389" y="173" width="15" height="41" rx="3" fill="#FFFFFF" stroke="#087F91" stroke-width="2"/><path d="M393 181 L400 181" fill="none" stroke="#087F91" stroke-width="1" stroke-linecap="round" /><path d="M393 191 L400 191" fill="none" stroke="#087F91" stroke-width="1" stroke-linecap="round" /><path d="M393 201 L400 201" fill="none" stroke="#087F91" stroke-width="1" stroke-linecap="round" /><rect x="36" y="245" width="16" height="40" rx="3" fill="#FFFFFF" stroke="#087F91" stroke-width="2"/><circle cx="51" cy="265" r="8" fill="none" stroke="#087F91" stroke-width="2"/><path d="M72 265 C127 265 157 221 227.92000000000002 221" fill="none" stroke="#087F91" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M243.76000000000002 219 C322.96 219 360 238 358 198" fill="none" stroke="#087F91" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="67" y="304" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400">Потоки внутри чаши условные</text><text x="111" y="352" text-anchor="middle" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">Забор воды</text><text x="329" y="352" text-anchor="middle" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">Возврат воды</text><path d="M111 369 L111 414" fill="none" stroke="#087F91" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M329 414 L329 369" fill="none" stroke="#087F91" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="22" y="430" width="396" height="191" rx="18" fill="#FFF5E6" stroke="#E9BA7C" stroke-width="2"/><text x="46" y="464" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">СИСТЕМА ВОДОПОДГОТОВКИ</text><rect x="52" y="496" width="55" height="80" rx="13" fill="#FFFFFF" stroke="#087F91" stroke-width="3"/><path d="M52 524 H107" fill="none" stroke="#087F91" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="72" y="484" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#087F91" stroke-width="2"/><path d="M79 476 L79 484" fill="none" stroke="#087F91" stroke-width="3" stroke-linecap="round" /><text x="127" y="518" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Фильтрация</text><text x="127" y="549" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400">Обработка воды</text><text x="127" y="577" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400">Подогрев (если есть)</text><text x="220" y="653" text-anchor="middle" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Вода проходит по замкнутому контуру.</text><text x="220" y="678" text-anchor="middle" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Но перемешивание зависит от схемы</text><text x="220" y="703" text-anchor="middle" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">подачи и забора воды.</text><rect x="22" y="730" width="396" height="100" rx="16" fill="#FFFFFF" stroke="#8BC7D3" stroke-width="2"/><circle cx="57" cy="771" r="20" fill="#087F91"/><text x="57" y="778" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">1</text><text x="91" y="777" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">Забор</text><text x="46" y="817" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Скиммер, лоток или донный водозабор.</text><rect x="22" y="841" width="396" height="100" rx="16" fill="#FFFFFF" stroke="#8BC7D3" stroke-width="2"/><circle cx="57" cy="882" r="20" fill="#087F91"/><text x="57" y="889" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">2</text><text x="91" y="888" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">Обработка</text><text x="46" y="928" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Фильтрация и дезинфекция воды.</text><rect x="22" y="952" width="396" height="100" rx="16" fill="#FFFFFF" stroke="#8BC7D3" stroke-width="2"/><circle cx="57" cy="993" r="20" fill="#087F91"/><text x="57" y="1000" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">3</text><text x="91" y="999" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">Возврат</text><text x="46" y="1039" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Вода поступает через форсунки.</text><rect x="22" y="1063" width="396" height="40" rx="11" fill="#087F91" stroke="none" stroke-width="1"/><text x="220" y="1090" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">Равномерность важнее видимого потока</text></svg>