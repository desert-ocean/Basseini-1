<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1120" role="img" aria-labelledby="t d"><title id="t">Защитные соединения техпомещения</title><desc id="d">Насос, фильтр, теплообменник и шкаф соединены проектными защитными проводниками с местной шиной, связанной с PE и ГЗШ. Водяные трубы не являются PE.</desc><rect width="420" height="1120" rx="22" fill="#f4f9fa"/><g font-family="Arial,sans-serif" fill="#17394c"><text x="20" y="46" font-size="23" font-weight="700">Защитная сеть помещения</text><path d="M65 140V525M355 140V525" stroke="#167b98" stroke-width="9"/><text x="83" y="555" font-size="16">технологическая вода</text><rect x="35" y="105" width="160" height="100" rx="13" fill="#fff" stroke="#43869a" stroke-width="4"/><text x="82" y="163" font-size="20" font-weight="700">Насос</text><rect x="225" y="105" width="160" height="100" rx="13" fill="#fff" stroke="#43869a" stroke-width="4"/><text x="271" y="163" font-size="20" font-weight="700">Фильтр</text><rect x="35" y="290" width="160" height="100" rx="13" fill="#fff" stroke="#43869a" stroke-width="4"/><text x="55" y="347" font-size="17" font-weight="700">Теплообменник</text><rect x="225" y="290" width="160" height="100" rx="13" fill="#fff" stroke="#43869a" stroke-width="4"/><text x="264" y="338" font-size="18" font-weight="700">Шкаф</text><text x="253" y="364" font-size="16">управления</text><path d="M115 205V680M305 205V680M115 390V680M305 390V680M115 680H305" fill="none" stroke="#278267" stroke-width="5"/><rect x="45" y="650" width="330" height="100" rx="14" fill="#e8f5ef" stroke="#278267" stroke-width="4"/><text x="82" y="694" font-size="20" font-weight="700">Местная шина</text><text x="82" y="724" font-size="16">проектные защитные связи</text><path d="M210 750V850" stroke="#278267" stroke-width="5"/><rect x="60" y="850" width="300" height="100" rx="14" fill="#fff" stroke="#278267" stroke-width="4"/><text x="124" y="893" font-size="20" font-weight="700">PE / ГЗШ здания</text><text x="26" y="1010" font-size="16">Водяная труба переносит воду</text><text x="26" y="1040" font-size="16" font-weight="700">и не заменяет PE-проводник.</text></g></svg>