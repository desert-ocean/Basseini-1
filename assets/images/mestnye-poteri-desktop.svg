<text x="1443.0" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173a53">Обратный клапан</text>
<text x="1443.0" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#476271">Сопротивление клапана</text>
<text x="800.0" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#173a53">Почему это важно</text>
<text x="800.0" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#476271">Местные сопротивления учитываются вместе с потерями напора на прямых трубах.</text>
