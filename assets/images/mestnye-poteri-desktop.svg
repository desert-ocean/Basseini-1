<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="t d">
<title id="t">Местные потери напора в трубопроводе</title><desc id="d">Пять типичных элементов с местными сопротивлениями: уголок 90 градусов, тройник, заужение, задвижка и обратный клапан.</desc>
<rect width="1600" height="660" fill="#f5f9fa"/>
<text x="800.0" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#123650">Где возникают местные потери</text>
<text x="800.0" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#456272">Поток меняет направление, скорость или проходит через арматуру</text>
<rect x="30" y="180" width="298" height="305" rx="23" fill="white" stroke="#d2e3eb" stroke-width="2"/>
