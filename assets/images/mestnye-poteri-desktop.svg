<text x="179.0" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173a53">Уголок 90°</text>
<text x="179.0" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#476271">Поток поворачивает</text>
<rect x="346" y="180" width="298" height="305" rx="23" fill="white" stroke="#d2e3eb" stroke-width="2"/>
<g transform="translate(371 226) scale(1)"><path d="M22 75 H228 M125 75 V18" stroke="#a9dfe9" stroke-width="38" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 75 H228 M125 75 V18" stroke="#1688ac" stroke-width="27" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 75h46l-13 -11m13 11l-13 11M125 65V33l-10 12m10-12l10 12" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/></g>
<text x="495.0" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173a53">Тройник</text>
<text x="495.0" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#476271">Разделение потоков</text>
<rect x="662" y="180" width="298" height="305" rx="23" fill="white" stroke="#d2e3eb" stroke-width="2"/>
<g transform="translate(687 226) scale(1)"><path d="M20 70 H84 L125 70 L167 70 H230" stroke="#a9dfe9" stroke-width="38" fill="none" stroke-linecap="round"/><path d="M20 70 H83 L112 70" stroke="#1688ac" stroke-width="26" fill="none" stroke-linecap="round"/><path d="M112 56 L145 64 L167 64 H230 V76 H167 L145 76 L112 84Z" fill="#1688ac" stroke="#0f6e93" stroke-width="2"/><path d="M42 70h43m-13-10l13 10-13 10M185 70h28m-11-8l11 8-11 8" stroke="white" stroke-width="4" fill="none"/></g>
<text x="811.0" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173a53">Заужение</text>
<text x="811.0" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#476271">Изменение скорости</text>
