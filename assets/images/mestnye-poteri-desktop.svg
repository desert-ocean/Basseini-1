<g transform="translate(1003 226) scale(1)"><path d="M20 75 H230" stroke="#a9dfe9" stroke-width="38" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 75 H230" stroke="#1688ac" stroke-width="27" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 48 L125 75 L90 102Z M160 48 L125 75 L160 102Z" fill="#f7b451" stroke="#bd761c" stroke-width="4"/><path d="M125 46V22H165" stroke="#bd761c" stroke-width="5" fill="none"/><rect x="155" y="10" width="24" height="19" rx="5" fill="#f7b451" stroke="#bd761c" stroke-width="3"/></g>
<text x="1127.0" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173a53">Задвижка</text>
