nchor="start">Как измеряют:</text><text x="259" y="636" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#20394D" text-anchor="start">капельный тест / титрование; результат — мг/л в пересчёте на CaCO₃.</text><text x="73" y="666" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#103353" text-anchor="start">Важно:</text><text x="162" y="666" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#20394D" text-anchor="start">щёлочность ≠ pH и ≠ кальциевая жёсткость. Графики условные, не измерения.</text></svg>