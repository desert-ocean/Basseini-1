<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="715" viewBox="0 0 1280 715" role="img" aria-labelledby="title desc"><title id="title">Щёлочность воды и устойчивость pH бассейна</title><desc id="desc">Сравнение низкой и высокой щёлочности, объяснение буферной способности и единиц измерения общей щёлочности.</desc><rect x="0" y="0" width="1280" height="715" rx="0" fill="#F7FBFD" stroke="none" stroke-width="1"/><text x="48" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="700" fill="#103353" text-anchor="start">Щёлочность воды</text><text x="49" y="111" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#526B80" text-anchor="start">Почему при одинаковом pH вода может по-разному реагировать на кислоту</text><rect x="48" y="145" width="1184" height="90" rx="18" fill="#E7F4FB" stroke="none" stroke-width="1"/><text x="78" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#103353" text-anchor="start">Общая щёлочность (TA)</text><text x="78" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#20394D" text-anchor="start">Способность воды нейтрализовать добавляемую кислоту</text><rect x="755" y="167" width="439" height="48" rx="14" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="973" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F6EAB" text-anchor="middle">Это не то же самое, что pH</text><rect x="48" y="261" width="372" height="318" rx="18" fill="white" stroke="#C8DAE7" stroke-width="1.5"/><rect x="49" y="262" width="370" height="65" rx="17" fill="#D8EDF8" stroke="none" stroke-width="1"/><text x="70" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#103353" text-anchor="start">Низкая щёлочность</text><text x="72" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F6EAB" text-anchor="start">pH меняется заметнее</text><line x1="78" y1="377" x2="78" y2="471" stroke="#9CB5C7" stroke-width="1.5"/><line x1="78" y1="471" x2="391" y2="471" stroke="#9CB5C7" stroke-width="1.5"/><polyline points="86.0,423.0 88.5,426.8 90.9,430.5 93.4,434.1 95.8,437.5 98.3,440.6 100.8,443.4 103.2,445.8 105.7,447.8 108.1,449.3 110.6,450.4 113.0,450.9 115.5,450.9 118.0,450.4 120.4,449.4 122.9,447.9 125.3,446.0 127.8,443.6 130.2,440.8 132.7,437.8 135.2,434.4 137.6,430.8 140.1,427.1 142.5,423.3 145.0,419.5 147.5,415.8 149.9,412.1 152.4,408.7 154.8,405.6 157.3,402.8 159.8,400.3 162.2,398.3 164.7,396.8 167.1,395.7 169.6,395.1 172.0,395.0 174.5,395.5 177.0,396.5 179.4,397.9 181.9,399.8 184.3,402.2 186.8,404.9 189.2,408.0 191.7,411.3 194.2,414.9 196.6,418.6 199.1,422.4 201.5,426.2 204.0,430.0 206.5,433.6 208.9,437.0 211.4,440.2 213.8,443.0 216.3,445.5 218.8,447.5 221.2,449.1 223.7,450.3 226.1,450.9 228.6,451.0 231.0,450.6 233.5,449.6 236.0,448.2 238.4,446.3 240.9,444.0 243.3,441.3 245.8,438.2 248.2,434.9 250.7,431.4 253.2,427.7 255.6,423.9 258.1,420.1 260.5,416.3 263.0,412.7 265.5,409.3 267.9,406.1 270.4,403.2 272.8,400.7 275.3,398.6 277.8,397.0 280.2,395.8 282.7,395.2 285.1,395.0 287.6,395.4 290.0,396.3 292.5,397.7 295.0,399.5 297.4,401.8 299.9,404.5 302.3,407.5 304.8,410.8 307.2,414.3 309.7,418.0 312.2,421.8 314.6,425.6 317.1,429.4 319.5,433.0 322.0,436.5 324.5,439.7 326.9,442.6 329.4,445.1 331.8,447.2 334.3,448.9 336.8,450.1 339.2,450.8 341.7,451.0 344.1,450.7 346.6,449.8 349.0,448.5 351.5,446.6 354.0,444.4 356.4,441.7 358.9,438.7 361.3,435.4 363.8,431.9 366.2,428.2 368.7,424.5 371.2,420.7 373.6,416.9 376.1,413.2 378.5,409.8 381.0,406.5" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="508" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#20394D" text-anchor="start">При внесении кислоты</text><text x="72" y="534" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#20394D" text-anchor="start">pH может снижаться быстрее.</text><text x="392" y="476" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#526B80" text-anchor="end">время</text><rect x="454" y="261" width="372" height="318" rx="18" fill="white" stroke="#C8DAE7" stroke-width="1.5"/><rect x="455" y="262" width="370" height="65" rx="17" fill="#D8EDF8" stroke="none" stroke-width="1"/><text x="476" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#103353" text-anchor="start">Подходящая для системы</text><text x="478" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F6EAB" text-anchor="start">pH устойчивее к изменениям</text><line x1="484" y1="377" x2="484" y2="471" stroke="#9CB5C7" stroke-width="1.5"/><line x1="484" y1="471" x2="797" y2="471" stroke="#9CB5C7" stroke-width="1.5"/><polyline points="492.0,423.0 494.5,424.1 496.9,425.2 499.4,426.2 501.8,427.1 504.3,428.0 506.8,428.8 509.2,429.5 511.7,430.1 514.1,430.5 516.6,430.8 519.0,431.0 521.5,431.0 524.0,430.8 526.4,430.6 528.9,430.1 531.3,429.6 533.8,428.9 536.2,428.1 538.7,427.2 541.2,426.3 543.6,425.2 546.1,424.2 548.5,423.1 551.0,422.0 553.5,420.9 555.9,419.9 558.4,418.9 560.8,418.0 563.3,417.2 565.8,416.5 568.2,415.9 570.7,415.5 573.1,415.2 575.6,415.0 578.0,415.0 580.5,415.1 583.0,415.4 585.4,415.8 587.9,416.4 590.3,417.1 592.8,417.8 595.2,418.7 597.7,419.7 600.2,420.7 602.6,421.7 605.1,422.8 607.5,423.9 610.0,425.0 612.5,426.0 614.9,427.0 617.4,427.9 619.8,428.7 622.3,429.4 624.8,430.0 627.2,430.5 629.7,430.8 632.1,431.0 634.6,431.0 637.0,430.9 639.5,430.6 642.0,430.2 644.4,429.7 646.9,429.0 649.3,428.2 651.8,427.4 654.2,426.4 656.7,425.4 659.2,424.3 661.6,423.3 664.1,422.2 666.5,421.1 669.0,420.1 671.5,419.1 673.9,418.2 676.4,417.3 678.8,416.6 681.3,416.0 683.8,415.6 686.2,415.2 688.7,415.0 691.1,415.0 693.6,415.1 696.0,415.4 698.5,415.8 701.0,416.3 703.4,416.9 705.9,417.7 708.