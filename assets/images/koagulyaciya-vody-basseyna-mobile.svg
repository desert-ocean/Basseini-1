<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1320" viewBox="0 0 440 1320"><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#118f99"/></marker>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#13929a"/><stop offset="100%" stop-color="#0b8d94"/></linearGradient>
</defs><rect width="440" height="1290" fill="white"/><text x="220.0" y="42" font-family="Arial, DejaVu Sans, sans-serif" font-weight="800" fill="#0d224a" font-size="28" text-anchor="middle">Коагуляция воды</text><text x="220.0" y="72" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" fill="#314a72" font-size="15" text-anchor="middle">Как частицы укрупняются и затем задерживаются фильтром</text><rect x="12" y="96" width="416" height="740" rx="20" fill="#f8fdfe" stroke="#52b8c0" stroke-width="2"/><rect x="12" y="96" width="416" height="50" rx="20" fill="#cceef3" stroke="#52b8c0" stroke-width="2"/><text x="36" y="132" font-family="Arial, DejaVu Sans, sans-serif" font-weight="800" fill="#0d224a" font-size="28" text-anchor="start">Как работает коагуляция</text><circle cx="90" cy="156" r="5" fill="#e0a04c"/><circle cx="115" cy="180" r="8" fill="#e0a04c"/><circle cx="120" cy="160" r="6" fill="#e0a04c"/><circle cx="122" cy="208" r="7" fill="#e0a04c"/><circle cx="58" cy="200" r="6" fill="#e0a04c"/><text x="220" y="162" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" fill="#0d224a" font-size="20" text-anchor="start"><tspan x="220" dy="0">1. Мелкие</tspan><tspan x="220" dy="24">взвеси</tspan></text><text x="220" y="210" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" fill="#314a72" font-size="15" text-anchor="start"><tspan x="220" dy="0">Слишком мелкие частицы</tspan><tspan x="220" dy="20">плохо задерживаются</tspan><tspan x="220" dy="20">обычной фильтрацией</tspan></text><line x1="90" y1="250" x2="90" y2="322" stroke="#118f99" stroke-width="6" marker-end="url(#arr)"/><rect x="50" y="340" width="80" height="86" rx="16" fill="#d8f2f7" stroke="#397d98" stroke-width="5"/><rect x="76" y="318" width="28" height="24" rx="8" fill="#d8f2f7" stroke="#397d98" stroke-width="5"/><circle cx="90" cy="385" r="15" fill="none" stroke="#118f99" stroke-width="4"/><path d="M 90 370 L 90 400 M 75 385 L 105 385" stroke="#118f99" stroke-width="4"/><text x="220" y="356" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" fill="#0d224a" font-size="20" text-anchor="start"><tspan x="220" dy="0">2. Коагулянт</tspan></text><text x="220" y="390" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" fill="#314a72" font-size="15" text-anchor="start"><tspan x="220" dy="0">Реагент помогает частицам</tspan><tspan x="220" dy="20">объединяться между собой</tspan></text><line x1="90" y1="438" x2="90" y2="512" stroke="#118f99" stroke-width="6" marker-end="url(#arr)"/><circle cx="78" cy="578" r="24" fill="#e0a04c"/><circle cx="108" cy="550" r="16" fill="#e0a04c"/><circle cx="112" cy="592" r="19" fill="#e0a04c"/><circle cx="54" cy="592" r="14" fill="#e0a04c"/><text x="220" y="548" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" fill="#0d224a" font-size="20" text-anchor="start"><tspan x="220" dy="0">3. Хлопья</tspan><tspan x="220" dy="24">крупнее</tspan></text><text x="220" y="594" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" fill="#314a72" font-size="15" text-anchor="start"><tspan x="220" dy="0">Укрупнённые частицы</tspan><tspan x="220" dy="20">проще уловить в фильтре</tspan></text><line x1="90" y1="626" x2="90" y2="700" stroke="#118f99" stroke-width="6" marker-end="url(#arr)"/><rect x="52" y="720" width="78" height="108" rx="14" fill="none" stroke="#397d98" stroke-width="5"/><line x1="68" y1="742" x2="114" y2="742" stroke="#397d98" stroke-width="5"/><line x1="68" y1="764" x2="114" y2="764" stroke="#397d98" stroke-width="5"/><line x1="68" y1="786" x2="114" y2="786" stroke="#397d98" stroke-width="5"/><line x1="68" y1="808" x2="114" y2="808" stroke="#397d98" stroke-width="5"/><text x="220" y="748" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" fill="#0d224a" font-size="20" text-anchor="start"><tspan x="220" dy="0">4. Фильтр</tspan></text><text x="220" y="784" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" fill="#314a72" font-size="15" text-anchor="start"><tspan x="220" dy="0">Загрузка задерживает</tspan><tspan x="220" dy="20">укрупнённые загрязнения</tspan></text><rect x="12" y="860" width="416" height="230" rx="20" fill="#f8fdfe" stroke="#52b8c0" stroke-width="2"/><rect x="12" y="860" width="416" height="50" rx="20" fill="#cceef3" stroke="#52b8c0" stroke-width="2"/><text x="36" y="896" font-family="Arial, DejaVu Sans, sans-serif" font-weight="800" fill="#0d224a" font-size="28" text-anchor="start">Что важно помнить</text><text x="32" y="932" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" fill="#314a72" font-size="18" text-anchor="start"><tspan x="32" dy="0">• Коагуляция помогает фильтрации,</tspan><tspan x="32" dy="24">  а не заменяет её</tspan></text><text x="32" y="984" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" fill="#314a72" font-size="18" text-anchor="start"><tspan x="32" dy="0">• Передозировка реагента может</tspan><tspan x="32" dy="24">  ухудшить качество воды</tspan></text><text x="32" y="1036" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" fill="#314a72" font-size="18" text-anchor="start"><tspan x="32" dy="0">• Эффект оценивают вместе с работой</tspan><tspan x="32" dy="24">  фильтра и режимом промывки</tspan></text><rect x="12" y="1114" width="416" height="180" rx="22" fill="url(#banner)"/><circle cx="52" cy="1183" r="24" fill="#fff" opacity="0.96"/><path d="M 40 1183 l 8 8 l 16 -20" fill="none" stroke="#118f99" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="1162" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" fill="white" font-size="20" text-anchor="start"><tspan x="92" dy="0">Коагуляция в бассейне — это</tspan><tspan x="92" dy="22">укрупнение мелких частиц</tspan><tspan x="92" dy="22">перед фильтрацией, а не</tspan><tspan x="92" dy="22">самостоятельная замена</tspan><tspan x="92" dy="22">водоподготовки.</tspan></text></svg>