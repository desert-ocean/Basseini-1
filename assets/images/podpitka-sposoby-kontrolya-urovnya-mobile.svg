<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1540" role="img" aria-labelledby="title desc">
  <title id="title">Четыре способа контроля уровня воды</title>
  <desc id="desc">Кондуктометрические электроды, ультразвуковое измерение расстояния до воды, магнитный поплавок с герконом и механический поплавковый клапан.</desc>
  <rect width="440" height="1540" rx="20" fill="#f4f8f9"/><text x="220" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#173b50">Контроль уровня воды</text>
  <g font-family="Arial,sans-serif" fill="#173b50">
    <g transform="translate(15 65)"><rect width="410" height="345" rx="16" fill="#fff" stroke="#c7d9df" stroke-width="2"/><text x="18" y="34" font-size="18" font-weight="700">1. Кондуктометрические электроды</text><path d="M72 80v175h210V80" fill="#f7fbfc" stroke="#427b91" stroke-width="4"/><path d="M77 170h200v80H77z" fill="#d8eef3"/><path d="M77 170h200" stroke="#1590ad" stroke-width="3"/><path d="M112 88v32m45-32v69m45-69v106m45-106v143" stroke="#d28a38" stroke-width="5"/><rect x="305" y="125" width="88" height="70" rx="8" fill="#eaf3f6" stroke="#427b91" stroke-width="3"/><text x="349" y="153" text-anchor="middle" font-size="14">Контроллер</text><text x="349" y="175" text-anchor="middle" font-size="12">клапан</text><path d="M112 120h193m45 0v5M157 157h148m45 0v-1M202 194h103m45 0v1M247 231h58m45-36v-1" stroke="#c18b4c" stroke-width="1.5" stroke-dasharray="4 4"/><text x="18" y="284" font-size="14">Общий электрод и отдельные отметки:</text><text x="18" y="306" font-size="14">рабочие уровни и аварийный верхний.</text><text x="18" y="330" font-size="13" fill="#4e6874">Ток проходит через проводящую воду.</text></g>
    <g transform="translate(15 430)"><rect width="410" height="345" rx="16" fill="#fff" stroke="#c7d9df" stroke-width="2"/><text x="18" y="34" font-size="18" font-weight="700">2. Ультразвуковой датчик</text><path d="M90 95v160h230V95" fill="#f7fbfc" stroke="#427b91" stroke-width="4"/><path d="M95 185h220v65H95z" fill="#d8eef3"/><path d="M95 185h220" stroke="#1590ad" stroke-width="3"/><rect x="172" y="75" width="64" height="32" rx="7" fill="#eaf3f6" stroke="#427b91" stroke-width="3"/><path d="M183 110l-30 58m51-58v58m31-58 30 58" stroke="#55a4b9" stroke-width="3" stroke-dasharray="7 5"/><text x="203" y="155" text-anchor="middle" font-size="13">эхо</text><text x="18" y="284" font-size="14">Измеряет расстояние по времени возврата</text><text x="18" y="306" font-size="14">ультразвукового импульса.</text><text x="18" y="330" font-size="13" fill="#4e6874">Нужны настройка диапазона и свободный путь.</text></g>
    <g transform="translate(15 795)"><rect width="410" height="345" rx="16" fill="#fff" stroke="#c7d9df" stroke-width="2"/><text x="18" y="34" font-size="18" font-weight="700">3. Поплавок с магнитом и герконом</text><rect x="50" y="75" width="120" height="170" rx="20" fill="#f7fbfc" stroke="#427b91" stroke-width="4"/><path d="M55 160h110v80H55z" fill="#d8eef3"/><path d="M55 160h110" stroke="#1590ad" stroke-width="3"/><rect x="90" y="140" width="48" height="45" rx="16" fill="#eaf3f6" stroke="#427b91" stroke-width="3"/><circle cx="114" cy="151" r="7" fill="#d28a38"/><path d="M138 115v95" stroke="#718995" stroke-width="5"/><rect x="129" y="130" width="18" height="17" rx="5" fill="#d28a38"/><path d="M147 138h40" stroke="#c18b4c" stroke-width="2" stroke-dasharray="4 4"/><rect x="188" y="120" width="14" height="38" rx="4" fill="#f4d5b3" stroke="#9c6b35" stroke-width="2"/><rect x="230" y="120" width="160" height="68" rx="8" fill="#eaf3f6" stroke="#427b91" stroke-width="3"/><text x="310" y="150" text-anchor="middle" font-size="15">Задержка сигнала</text><text x="310" y="173" text-anchor="middle" font-size="13">включение / отключение</text><text x="18" y="284" font-size="14">Магнит поплавка переключает контакт геркона.</text><text x="18" y="306" font-size="14">Задержка гасит частые переключения из-за волн.</text><text x="18" y="330" font-size="13" fill="#4e6874">Часто применяют в скиммерной шахте.</text></g>
    <g transform="translate(15 1160)"><rect width="410" height="345" rx="16" fill="#fff" stroke="#c7d9df" stroke-width="2"/><text x="18" y="34" font-size="18" font-weight="700">4. Механический поплавковый клапан</text><path d="M68 85v165h255V85" fill="#f7fbfc" stroke="#427b91" stroke-width="4"/><path d="M73 175h245v70H73z" fill="#d8eef3"/><path d="M73 175h245" stroke="#1590ad" stroke-width="3"/><path d="M20 117h115v22h58" fill="none" stroke="#087a9b" stroke-width="7"/><circle cx="193" cy="150" r="15" fill="#e2a257" stroke="#9a5a1d" stroke-width="3"/><path d="M193 150l77 38" stroke="#718995" stroke-width="6"/><ellipse cx="289" cy="200" rx="26" ry="15" fill="#e2a257" stroke="#9a5a1d" stroke-width="3"/><text x="18" y="284" font-size="14">Поплавок рычагом закрывает подачу</text><text x="18" y="306" font-size="14">при верхнем уровне — как бачок унитаза.</text><text x="18" y="330" font-size="13" fill="#4e6874">Не заменяет защиту питьевого водопровода.</text></g>
  </g>
</svg>
