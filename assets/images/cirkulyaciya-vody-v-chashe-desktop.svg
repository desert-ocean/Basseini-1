<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc"><title id="title">Циркуляция воды в чаше бассейна</title><desc id="desc">Схема забора воды из бассейна, прохождения водоподготовки и возврата через форсунки. Пояснения о равномерном перемешивании.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#087F91"/></marker><marker id="arrowWhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#FFFFFF"/></marker></defs><rect width="1280" height="790" fill="#FFFFFF"/><text x="640" y="66" text-anchor="middle" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="700">Циркуляция воды в чаше</text><text x="640" y="106" text-anchor="middle" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400">Забор → водоподготовка → возврат через форсунки</text><rect x="45" y="145" width="520" height="276" rx="20" fill="#DDF3F6" stroke="#8BC7D3" stroke-width="2"/><path d="M63 192 Q87 180 111 192 T159 192 T207 192 T255 192 T303 192 T351 192 T547 192" fill="none" stroke="#4EC0CF" stroke-width="3"/><text x="67" y="177" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">ЧАША БАССЕЙНА</text><rect x="536" y="210" width="15" height="41" rx="3" fill="#FFFFFF" stroke="#087F91" stroke-width="2"/><path d="M540 218 L547 218" fill="none" stroke="#087F91" stroke-width="1" stroke-linecap="round" /><path d="M540 228 L547 228" fill="none" stroke="#087F91" stroke-width="1" stroke-linecap="round" /><path d="M540 238 L547 238" fill="none" stroke="#087F91" stroke-width="1" stroke-linecap="round" /><rect x="59" y="340" width="16" height="40" rx="3" fill="#FFFFFF" stroke="#087F91" stroke-width="2"/><circle cx="74" cy="360" r="8" fill="none" stroke="#087F91" stroke-width="2"/><path d="M95 360 C150 360 180 316 315.40000000000003 316" fill="none" stroke="#087F91" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M336.20000000000005 314 C440.2 314 507 275 505 235" fill="none" stroke="#087F91" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="90" y="399" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400">Потоки внутри чаши условные</text><rect x="805" y="168" width="430" height="230" rx="18" fill="#FFF5E6" stroke="#E9BA7C" stroke-width="2"/><text x="829" y="202" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">СИСТЕМА ВОДОПОДГОТОВКИ</text><rect x="835" y="234" width="55" height="80" rx="13" fill="#FFFFFF" stroke="#087F91" stroke-width="3"/><path d="M835 262 H890" fill="none" stroke="#087F91" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="855" y="222" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#087F91" stroke-width="2"/><path d="M862 214 L862 222" fill="none" stroke="#087F91" stroke-width="3" stroke-linecap="round" /><text x="910" y="256" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Фильтрация</text><text x="910" y="287" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400">Обработка воды</text><text x="910" y="315" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400">Подогрев (если есть)</text><text x="681" y="160" text-anchor="middle" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">ЗАБОР ВОДЫ</text><path d="M570 215 L788 215" fill="none" stroke="#087F91" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M790 344 L575 344" fill="none" stroke="#087F91" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><text x="681" y="382" text-anchor="middle" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">ВОЗВРАТ ВОДЫ</text><text x="640" y="469" text-anchor="middle" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">Циркуляционный контур обеспечивает движение воды, но не гарантирует</text><text x="640" y="499" text-anchor="middle" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">равномерное перемешивание во всех участках чаши.</text><rect x="45" y="533" width="377" height="168" rx="16" fill="#FFFFFF" stroke="#8BC7D3" stroke-width="2"/><circle cx="80" cy="574" r="20" fill="#087F91"/><text x="80" y="581" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">1</text><text x="114" y="580" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">Забор воды</text><text x="69" y="620" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Скиммеры, переливной лоток</text><text x="69" y="648" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">и донные водозаборы.</text><rect x="451" y="533" width="377" height="168" rx="16" fill="#FFFFFF" stroke="#8BC7D3" stroke-width="2"/><circle cx="486" cy="574" r="20" fill="#087F91"/><text x="486" y="581" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">2</text><text x="520" y="580" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">Водоподготовка</text><text x="475" y="620" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Фильтрация, дезинфекция,</text><text x="475" y="648" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">при необходимости — подогрев.</text><rect x="857" y="533" width="378" height="168" rx="16" fill="#FFFFFF" stroke="#8BC7D3" stroke-width="2"/><circle cx="892" cy="574" r="20" fill="#087F91"/><text x="892" y="581" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">3</text><text x="926" y="580" text-anchor="start" fill="#102C45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">Возврат воды</text><text x="881" y="620" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Форсунки распределяют воду</text><text x="881" y="648" text-anchor="start" fill="#234459" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">и формируют движение в чаше.</text><rect x="45" y="718" width="1190" height="49" rx="13" fill="#087F91" stroke="none" stroke-width="1"/><text x="640" y="749" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700">Качество циркуляции зависит от схемы подачи, забора и распределения расхода.</text></svg>