<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1144" viewBox="0 0 430 1144" role="img" aria-labelledby="title desc"><title id="title">Щёлочность воды и устойчивость pH бассейна</title><desc id="desc">Сравнение низкой и высокой щёлочности, объяснение буферной способности и единиц измерения общей щёлочности.</desc><rect x="0" y="0" width="430" height="1144" rx="0" fill="#F7FBFD" stroke="none" stroke-width="1"/><text x="24" y="47" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#103353" text-anchor="start">Щёлочность воды</text><text x="25" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#526B80" text-anchor="start">Как она влияет на устойчивость pH</text><rect x="18" y="103" width="394" height="125" rx="15" fill="#E7F4FB" stroke="none" stroke-width="1"/><text x="35" y="135" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#103353" text-anchor="start">Общая щёлочность (TA)</text><text x="35" y="164" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#20394D" text-anchor="start">Способность воды нейтрализовать</text><text x="35" y="187" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#20394D" text-anchor="start">добавляемую кислоту.</text><text x="35" y="213" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F6EAB" text-anchor="start">Это не то же самое, что pH</text><rect x="18" y="245" width="394" height="222" rx="15" fill="white" stroke="#C8DAE7" stroke-width="1.3"/><rect x="19" y="246" width="392" height="47" rx="14" fill="#D8EDF8" stroke="none" stroke-width="1"/><text x="35" y="276" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#103353" text-anchor="start">Низкая щёлочность</text><text x="35" y="321" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F6EAB" text-anchor="start">pH может меняться резко</text><line x1="38" y1="336" x2="38" y2="402" stroke="#9CB5C7" stroke-width="1.5"/><line x1="38" y1="402" x2="386" y2="402" stroke="#9CB5C7" stroke-width="1.5"/><polyline points="46.0,368.0 48.8,371.4 51.5,374.7 54.2,377.9 57.0,381.0 59.8,383.7 62.5,386.2 65.2,388.4 68.0,390.2 70.8,391.5 73.5,392.5 76.2,392.9 79.0,393.0 81.8,392.5 84.5,391.6 87.2,390.3 90.0,388.5 92.8,386.4 95.5,383.9 98.2,381.2 101.0,378.2 103.8,375.0 106.5,371.7 109.2,368.3 112.0,364.9 114.8,361.5 117.5,358.3 120.2,355.3 123.0,352.5 125.8,350.0 128.5,347.8 131.2,346.0 134.0,344.6 136.8,343.6 139.5,343.1 142.2,343.0 145.0,343.4 147.8,344.3 150.5,345.6 153.2,347.3 156.0,349.4 158.8,351.9 161.5,354.6 164.2,357.6 167.0,360.8 169.8,364.1 172.5,367.5 175.2,370.9 178.0,374.2 180.8,377.4 183.5,380.5 186.2,383.3 189.0,385.9 191.8,388.1 194.5,389.9 197.2,391.3 200.0,392.3 202.8,392.9 205.5,393.0 208.2,392.6 211.0,391.8 213.8,390.5 216.5,388.8 219.2,386.8 222.0,384.3 224.8,381.6 227.5,378.6 230.2,375.5 233.0,372.2 235.7,368.8 238.5,365.4 241.2,362.0 244.0,358.8 246.7,355.7 249.5,352.9 252.2,350.3 255.0,348.1 257.8,346.2 260.5,344.8 263.2,343.7 266.0,343.1 268.8,343.0 271.5,343.4 274.2,344.1 277.0,345.4 279.8,347.0 282.5,349.1 285.2,351.5 288.0,354.2 290.8,357.1 293.5,360.3 296.2,363.6 299.0,367.0 301.8,370.4 304.5,373.7 307.2,377.0 310.0,380.0 312.8,382.9 315.5,385.5 318.2,387.8 321.0,389.7 323.8,391.1 326.5,392.2 329.2,392.8 332.0,393.0 334.8,392.7 337.5,391.9 340.2,390.7 343.0,389.1 345.8,387.1 348.5,384.7 351.2,382.1 354.0,379.1 356.8,376.0 359.5,372.7 362.2,369.3 365.0,365.9 367.8,362.5 370.5,359.3 373.2,356.2 376.0,353.3" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="377" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#526B80" text-anchor="end">время</text><text x="35" y="432" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#20394D" text-anchor="start">Слабее сопротивляется подкислению.</text><text x="35" y="452" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#20394D" text-anchor="start">Корректировки могут быть чаще.</text><rect x="18" y="483" width="394" height="222" rx="15" fill="white" stroke="#C8DAE7" stroke-width="1.3"/><rect x="19" y="484" width="392" height="47" rx="14" fill="#D8EDF8" stroke="none" stroke-width="1"/><text x="35" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#103353" text-anchor="start">Подходящая для системы</text><text x="35" y="559" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F6EAB" text-anchor="start">pH устойчивее к изменениям</text><line x1="38" y1="574" x2="38" y2="640" stroke="#9CB5C7" stroke-width="1.5"/><line x1="38" y1="640" x2="386" y2="640" stroke="#9CB5C7" stroke-width="1.5"/><polyline points="46.0,606.0 48.8,607.0 51.5,607.9 54.2,608.8 57.0,609.6 59.8,610.4 62.5,611.1 65.2,611.7 68.0,612.2 70.8,612.6 73.5,612.8 76.2,613.0 79.0,613.0 81.8,612.9 84.5,612.6 87.2,612.2 90.0,611.7 92.8,611.2 95.5,610.5 98.2,609.7 101.0,608.8 103.8,608.0 106.5,607.0 109.2,606.1 112.0,605.1 114.8,604.2 117.5,603.3 120.2,602.4 123.0,601.7 125.8,600.9 128.5,600.3 131.2,599.8 134.0,599.4 136.8,599.2 139.5,599.0 142.2,599.0 145.0,599.1 147.8,599.4 150.5,599.7 153.2,600.2 156.0,600.8 158.8,601.5 161.5,602.2 164.2,603.1 167.0,604.0 169.8,604.9 172.5,605.9 175.2,606.8 178.0,607.7 180.8,608.6 183.5,609.5 186.2,610.3 189.0,611.0 191.8,611.6 194.5,612.1 197.2,612.5 200.0,612.8 202.8,613.0 205.5,613.0 208.2,612.9 211.0,612.7 213.8,612.3 216.5,611.8 219.2,611.3 222.0,610.6 224.8,609.8 227.5,609.0 230.2,608.1 233.0,607.2 235.7,606.2 238.5,605.3 241.2,604.3 244.0,603.4 246.7,602.6 249.5,601.8 252.2,601.1 255.0,600.4 257.8,599.9 260.5,599.5 263.2,599.2 266.0,599.0 268.8,599.0 271.5,599.1 274.2,599.3 277.0,599.7 279.8,600.1 282.5,600.7 285.2,601.4 288.0,602.1 290.8,603.0 293.5,603.8 296.2,604.8 299.0,605.7 301.8,606.7 304.5,607.6 307.2,608.5 310.0,609.4 312.8,610.2 315.5,610.9 318.2,611.5 321.0,612.1 323.8,612.5 326.5,612.8 329.2,613.0 332.0,613.0 334.8,612.9 337.5,612.7 340.2,612.4 343.0,611.9 345.8,611.3 348.5,610.7 351.2,609.9 354.0,609.1 356.8,608.2 359.5,607.3 362.2,606.4 365.0,605.4 367.8,604.5 370.5,603.6 373.2,602.7 376.0,601.9" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="377" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#526B80" text-anchor="end">время</text><text x="35" y="670" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#20394D" text-anchor="start">Буфер сглаживает колебания,</text><text x="35" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#20394D" text-anchor="start">но не фиксирует pH навсегда.</text><rect x="18" y="721" width="394" height="222" rx="15" fill="white" stroke="#C8DAE7" stroke-width="1.3"/><rect x="19" y="722" width="392" height="47" rx="14" fill="#D8EDF8" stroke="none" stroke-width="1"/><text x="35" y="752" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#103353" text-anchor="start">Высокая щёлочность</text><text x="35" y="797" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#B96A16" text-anchor="start">Снижать pH труднее</text><line x1="38" y1="812" x2="38" y2="878" stroke="#9CB5C7" stroke-width="1.5"/><line x1="38" y1="878" x2="386" y2="878" stroke="#9CB5C7" stroke-width="1.5"/><polyline points="46.0,844.0 48.8,844.7 51.5,845.3 54.2,846.0 57.0,846.6 59.8,847.1 62.5,847.6 65.2,848.1 68.0,848.4 70.8,848.7 73.5,848.9 76.2,849.0 79.0,849.0 81.8,848.9 84.5,848.7 87.2,848.5 90.0,848.1 92.8,847.7 95.5,847.2 98.2,846.6 101.0,846.0 103.8,845.4 106.5,844.7 109.2,844.1 112.0,843.4 114.8,842.7 117.5,842.1 120.2,841.5 123.0,840.9 125.8,840.4 128.5,840.0 131.