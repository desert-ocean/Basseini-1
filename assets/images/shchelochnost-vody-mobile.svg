" font-weight="400" fill="#20394D" text-anchor="start">Капельный тест или титрование.</text><text x="35" y="1046" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#20394D" text-anchor="start">Единицы: мг/л в пересчёте на CaCO₃.</text><text x="35" y="1068" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#20394D" text-anchor="start">Щёлочность ≠ pH ≠ жёсткость.</text><text x="22" y="1121" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#526B80" text-anchor="start">Графики схематичные и не задают нормативный диапазон.</text></svg>