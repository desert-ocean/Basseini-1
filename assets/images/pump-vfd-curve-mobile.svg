<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 660" role="img" aria-labelledby="t d">
<title id="t">График рабочей точки при снижении оборотов насоса</title><desc id="d">Две убывающие кривые насоса при разных оборотах пересекаются с возрастающей кривой системы. При снижении скорости рабочая точка перемещается к меньшему расходу и меньшему напору.</desc>
<rect width="500" height="660" rx="20" fill="#f3f8fa"/><text x="250" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#193e52">Рабочая точка Q–H</text><g stroke="#cbdde4" fill="none"><path d="M86 100V485H450M86 410H450M86 335H450M86 260H450M86 185H450M160 100V485M235 100V485M310 100V485M385 100V485"/></g><path d="M86 485H460M86 500V90" fill="none" stroke="#193e52" stroke-width="3"/>
<g font-family="system-ui,sans-serif" fill="#193e52"><text x="270" y="526" text-anchor="middle" font-size="18">Расход Q</text><text x="36" y="290" text-anchor="middle" font-size="18" transform="rotate(-90 36 290)">Напор H</text>
<path d="M105 145C200 165 295 255 430 455" fill="none" stroke="#087a9b" stroke-width="6"/><path d="M105 240C200 260 295 325 430 460" fill="none" stroke="#bd742d" stroke-width="6"/><path d="M105 460C205 430 300 350 430 255" fill="none" stroke="#596c75" stroke-width="6" stroke-dasharray="10 7"/>
<circle cx="335" cy="325" r="8" fill="#087a9b"/><text x="325" y="309" text-anchor="end" font-size="17" font-weight="700">A</text><circle cx="305" cy="347" r="8" fill="#bd742d"/><text x="295" y="377" text-anchor="end" font-size="17" font-weight="700">B</text>
<path d="M335 325v160M305 347v138" stroke="#718892" stroke-dasharray="4 5"/>
<rect x="35" y="550" width="430" height="82" rx="12" fill="#fff" stroke="#c9dce4"/><path d="M55 573h52" stroke="#087a9b" stroke-width="5"/><text x="120" y="579" font-size="15">Насос, выше обороты</text><path d="M55 598h52" stroke="#bd742d" stroke-width="5"/><text x="120" y="604" font-size="15">Насос, ниже обороты</text><path d="M290 573h52" stroke="#596c75" stroke-width="5" stroke-dasharray="8 5"/><text x="355" y="579" font-size="15">Система</text><text x="290" y="611" font-size="14">Кривые условные</text></g></svg>
