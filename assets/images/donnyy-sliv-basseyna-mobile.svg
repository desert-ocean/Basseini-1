<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1040" viewBox="0 0 420 1040" role="img" aria-labelledby="title desc"><title id="title">Донный слив бассейна: устройство и безопасность</title><desc id="desc">Принципиальная схема двух защищённых донных водозаборов, объединённых во всасывающую линию. Не монтажный чертёж.</desc>
