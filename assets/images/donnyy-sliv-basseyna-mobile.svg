<text x="33" y="451" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#12314d">Общая всасывающая линия →</text>
<text x="33" y="473" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#597184">к насосной системе</text>
<rect x="15" y="505" width="390" height="106" rx="14" fill="white" stroke="#c6dfea" stroke-width="1.2"/>
<circle cx="47" cy="538" r="18" fill="#e8f6f9" stroke="#087c9b" stroke-width="1.3"/>
<text x="47" y="544" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#087c9b">01</text>
<text x="77" y="545" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#12314d">Забор воды</text>
<text x="31" y="574" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#597184">Через защитную решётку</text>
<text x="31" y="595" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#597184">в корпус донного слива.</text>
<rect x="15" y="627" width="390" height="106" rx="14" fill="white" stroke="#c6dfea" stroke-width="1.2"/>
<circle cx="47" cy="660" r="18" fill="#e8f6f9" stroke="#087c9b" stroke-width="1.3"/>
<text x="47" y="666" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#087c9b">02</text>
<text x="77" y="667" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#12314d">Гидравлика</text>
<text x="31" y="696" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#597184">Расход и диаметр труб</text>
<text x="31" y="717" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#597184">определяются расчётом.</text>
<rect x="15" y="749" width="390" height="106" rx="14" fill="white" stroke="#c6dfea" stroke-width="1.2"/>
<circle cx="47" cy="782" r="18" fill="#e8f6f9" stroke="#087c9b" stroke-width="1.3"/>
<text x="47" y="788" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#087c9b">03</text>
<text x="77" y="789" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#12314d">Безопасность</text>
<text x="31" y="818" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#597184">Защита от присасывания</text>
<text x="31" y="839" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#597184">подбирается для всей системы.</text>
<rect x="15" y="883" width="390" height="137" rx="14" fill="#e7f0f4" stroke="none" stroke-width="1"/>
<text x="31" y="912" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#12314d">Важно</text>
<text x="31" y="939" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#12314d">Схема условная, не для монтажа.</text>
<text x="31" y="960" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#12314d">Нельзя использовать бассейн, если</text>
<text x="31" y="981" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#12314d">крышка отсутствует или повреждена.</text>
<text x="31" y="1002" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#12314d">Конфигурацию определяет проект.</text>
