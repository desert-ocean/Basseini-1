<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Принцип работы УЗО: норма и утечка</title><desc id="d">В двух панелях показаны фазный L и нейтральный N через измерительную часть УЗО, нагрузка и отдельный защитный PE. При утечке часть тока уходит по PE, УЗО отключает цепь.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#167b98"/></marker><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c96c2d"/></marker></defs><rect width="1200" height="650" rx="24" fill="#f4f9fa"/><g font-family="Arial,sans-serif" fill="#17394c"><text x="36" y="55" font-size="30" font-weight="700">УЗО сравнивает токи L и N</text><rect x="28" y="88" width="560" height="520" rx="20" fill="#fff" stroke="#d5e6ea" stroke-width="3"/><rect x="612" y="88" width="560" height="520" rx="20" fill="#fff" stroke="#d5e6ea" stroke-width="3"/><text x="60" y="138" font-size="27" font-weight="700">Нормальная работа</text><text x="644" y="138" font-size="27" font-weight="700">Утечка при повреждении</text><text x="60" y="178" font-size="20">Сумма токов рабочих проводников ≈ 0</text><text x="644" y="178" font-size="20">Возникает дифференциальный ток</text>
<text x="48" y="238" font-size="23" font-weight="700">L</text><text x="48" y="365" font-size="23" font-weight="700">N</text><path d="M82 230H170M268 230H390M390 360H268M170 360H82" fill="none" stroke="#167b98" stroke-width="8" marker-end="url(#a)"/><rect x="170" y="194" width="98" height="202" rx="14" fill="#e7f4f7" stroke="#43869a" stroke-width="3"/><text x="188" y="275" font-size="21" font-weight="700">УЗО</text><circle cx="219" cy="315" r="23" fill="none" stroke="#43869a" stroke-width="5"/><rect x="390" y="260" width="150" height="82" rx="12" fill="#fff8ed" stroke="#cc8a4a" stroke-width="3"/><text x="412" y="309" font-size="21" font-weight="700">Нагрузка</text><path d="M450 342V452H520" fill="none" stroke="#278267" stroke-width="6"/><path d="M520 442v20m-18 0h36m-30 10h24m-18 10h12" stroke="#278267" stroke-width="4"/><text x="60" y="496" font-size="19">PE — отдельный защитный путь</text><text x="63" y="555" font-size="20">L → нагрузка → N; PE не несёт рабочий ток</text>
<text x="632" y="238" font-size="23" font-weight="700">L</text><text x="632" y="365" font-size="23" font-weight="700">N</text><path d="M665 230H752M850 230H972M972 360H850M752 360H665" fill="none" stroke="#167b98" stroke-width="8" marker-end="url(#a)"/><rect x="752" y="194" width="98" height="202" rx="14" fill="#fff0e8" stroke="#c96c2d" stroke-width="3"/><text x="770" y="275" font-size="21" font-weight="700">УЗО</text><circle cx="801" cy="315" r="23" fill="none" stroke="#c96c2d" stroke-width="5"/><path d="M775 209l52 52m0-52-52 52" stroke="#c96c2d" stroke-width="4"/><rect x="972" y="260" width="150" height="82" rx="12" fill="#fff8ed" stroke="#cc8a4a" stroke-width="3"/><text x="994" y="309" font-size="21" font-weight="700">Нагрузка</text><path d="M1030 342V432H1110M1000 342V405H920V480H1065" fill="none" stroke="#278267" stroke-width="6"/><path d="M1110 422v20m-18 0h36m-30 10h24m-18 10h12" stroke="#278267" stroke-width="4"/><path d="M1010 382l-30 31m0 0 2-20m-2 20 19-5" fill="none" stroke="#c96c2d" stroke-width="6" marker-end="url(#f)"/><text x="692" y="516" font-size="19">Часть тока уходит по PE / другому пути</text><text x="693" y="555" font-size="20" font-weight="700">УЗО обнаруживает небаланс и отключает</text></g></svg>