<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="t d">
<title id="t">Частотное управление фонтанными струями</title><desc id="d">Два сопоставимых фонтана показывают качественное изменение высоты струй при большей и меньшей частоте вращения насоса с преобразователем. Высота не меняется линейно с частотой.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#087a9b"/></marker></defs><rect width="1100" height="520" rx="22" fill="#f3f8fa"/><text x="550" y="45" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#193e52">Настройка водной картины оборотами насоса</text>
<g font-family="system-ui,sans-serif" fill="#193e52">
<rect x="25" y="70" width="510" height="410" rx="18" fill="#fff" stroke="#c9dce4" stroke-width="2"/><text x="280" y="108" text-anchor="middle" font-size="22" font-weight="700">Более высокая частота</text><text x="280" y="137" text-anchor="middle" font-size="17">условно: больший расход в этой системе</text>
<rect x="80" y="395" width="400" height="46" rx="12" fill="#d8f2f8"/><path d="M80 402h400" stroke="#39a8c7" stroke-width="5"/><path d="M170 395 Q165 220 170 180M280 395Q280 165 280 145M390 395Q395 220 390 180" fill="none" stroke="#36a9c8" stroke-width="9" stroke-linecap="round"/><circle cx="170" cy="179" r="7" fill="#36a9c8"/><circle cx="280" cy="144" r="7" fill="#36a9c8"/><circle cx="390" cy="179" r="7" fill="#36a9c8"/><path d="M115 395h310" stroke="#087a9b" stroke-width="5"/><text x="280" y="465" text-anchor="middle" font-size="16">Один и тот же коллектор и форсунки</text>
<rect x="565" y="70" width="510" height="410" rx="18" fill="#fff" stroke="#c9dce4" stroke-width="2"/><text x="820" y="108" text-anchor="middle" font-size="22" font-weight="700">Сниженные обороты</text><text x="820" y="137" text-anchor="middle" font-size="17">условно: сниженная подача</text>
<rect x="620" y="395" width="400" height="46" rx="12" fill="#d8f2f8"/><path d="M620 402h400" stroke="#39a8c7" stroke-width="5"/><path d="M710 395Q705 300 710 275M820 395Q820 255 820 240M930 395Q935 300 930 275" fill="none" stroke="#36a9c8" stroke-width="9" stroke-linecap="round"/><circle cx="710" cy="274" r="7" fill="#36a9c8"/><circle cx="820" cy="239" r="7" fill="#36a9c8"/><circle cx="930" cy="274" r="7" fill="#36a9c8"/><path d="M655 395h310" stroke="#087a9b" stroke-width="5"/><text x="820" y="465" text-anchor="middle" font-size="16">Высоту настраивают по месту</text>
<rect x="414" y="174" width="270" height="52" rx="11" fill="#eaf4f7" stroke="#9bbecb"/><text x="549" y="196" text-anchor="middle" font-size="16" font-weight="700">Общий насос + ПЧ</text><text x="549" y="216" text-anchor="middle" font-size="15">задаёт режим коллектора</text>
<text x="550" y="505" text-anchor="middle" font-size="16" fill="#516d79">Качественная схема: струя не меняет высоту линейно с частотой; распределение по ветвям балансируют отдельно.</text></g></svg>
