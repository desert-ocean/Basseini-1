<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
  <title id="title">Четыре способа контроля уровня воды в бассейне</title>
  <desc id="desc">Схематично показаны кондуктометрические электроды и контроллер балансного бака, ультразвуковой датчик над водой, герконовый датчик с магнитным поплавком в скиммере и механический поплавковый клапан.</desc>
  <rect width="1200" height="830" rx="24" fill="#f4f8f9"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173b50">Способы контроля уровня и управления подпиткой</text>
  <g font-family="Arial,sans-serif" fill="#173b50">
    <g transform="translate(30 85)">
      <rect width="550" height="390" rx="18" fill="#fff" stroke="#c7d9df" stroke-width="2"/>
      <text x="25" y="42" font-size="22" font-weight="700">1. Кондуктометрические электроды</text>
      <path d="M75 105v190h310V105" fill="#f7fbfc" stroke="#427b91" stroke-width="4"/>
      <path d="M80 205h300v85H80z" fill="#d8eef3"/><path d="M80 205h300" stroke="#1590ad" stroke-width="3"/>
      <path d="M145 112v35M210 112v75M275 112v115M340 112v145" stroke="#d28a38" stroke-width="6"/>
      <circle cx="145" cy="151" r="6" fill="#d28a38"/><circle cx="210" cy="189" r="6" fill="#d28a38"/><circle cx="275" cy="229" r="6" fill="#d28a38"/><circle cx="340" cy="269" r="6" fill="#d28a38"/>
      <rect x="410" y="142" width="110" height="86" rx="10" fill="#eaf3f6" stroke="#427b91" stroke-width="3"/><text x="465" y="177" text-anchor="middle" font-size="17">Контроллер</text><text x="465" y="201" text-anchor="middle" font-size="14">входы / клапан</text>
      <path d="M145 151H410M210 189H410M275 229H410M340 269H410" stroke="#c18b4c" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="24" y="326" font-size="18">Общий электрод и отдельные отметки уровней:</text>
      <text x="24" y="348" font-size="18" fill="#4e6874">нижний рабочий и независимый аварийный.</text>
    </g>
    <g transform="translate(620 85)">
      <rect width="550" height="390" rx="18" fill="#fff" stroke="#c7d9df" stroke-width="2"/>
      <text x="25" y="42" font-size="22" font-weight="700">2. Ультразвуковой датчик</text>
      <path d="M95 110v185h280V110" fill="#f7fbfc" stroke="#427b91" stroke-width="4"/><path d="M100 220h270v70H100z" fill="#d8eef3"/><path d="M100 220h270" stroke="#1590ad" stroke-width="3"/>
      <rect x="205" y="95" width="70" height="34" rx="8" fill="#eaf3f6" stroke="#427b91" stroke-width="3"/><path d="M220 132l-28 67m48-67v67m28-67 28 67" stroke="#55a4b9" stroke-width="3" stroke-dasharray="8 6"/>
      <path d="M340 220h55v35" fill="none" stroke="#087a9b" stroke-width="4"/><path d="M190 207h80" stroke="#d28a38" stroke-width="3" marker-end="url(#arrow)"/><text x="233" y="197" text-anchor="middle" font-size="14">эхо</text>
      <text x="24" y="326" font-size="18">Уровень находят по времени возврата</text>
      <text x="24" y="348" font-size="18" fill="#4e6874">ультразвукового импульса; нужна настройка диапазона.</text>
    </g>
    <g transform="translate(30 440)">
      <rect width="550" height="350" rx="18" fill="#fff" stroke="#c7d9df" stroke-width="2"/>
      <text x="25" y="42" font-size="22" font-weight="700">3. Поплавок с магнитом и герконом</text>
      <rect x="75" y="95" width="150" height="200" rx="24" fill="#f7fbfc" stroke="#427b91" stroke-width="4"/><path d="M80 185h140v105H80z" fill="#d8eef3"/><path d="M80 185h140" stroke="#1590ad" stroke-width="3"/>
      <rect x="122" y="158" width="56" height="56" rx="18" fill="#eaf3f6" stroke="#427b91" stroke-width="3"/><circle cx="150" cy="170" r="8" fill="#d28a38"/><path d="M178 142v100" stroke="#718995" stroke-width="5"/><rect x="168" y="155" width="20" height="18" rx="6" fill="#d28a38"/><path d="M188 164h56" stroke="#d28a38" stroke-width="2" stroke-dasharray="5 4"/><rect x="245" y="145" width="18" height="40" rx="5" fill="#f4d5b3" stroke="#9c6b35" stroke-width="2"/>
      <rect x="330" y="145" width="160" height="75" rx="10" fill="#eaf3f6" stroke="#427b91" stroke-width="3"/><text x="410" y="177" text-anchor="middle" font-size="17">Реле времени</text><text x="410" y="201" text-anchor="middle" font-size="14">задержка вкл./выкл.</text><path d="M263 165h67" stroke="#c18b4c" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="24" y="326" font-size="18">Магнит поплавка переключает контакт геркона.</text>
      <text x="24" y="348" font-size="18" fill="#4e6874">Задержка сигнала подавляет срабатывания от волн.</text>
    </g>
    <g transform="translate(620 440)">
      <rect width="550" height="350" rx="18" fill="#fff" stroke="#c7d9df" stroke-width="2"/>
      <text x="25" y="42" font-size="22" font-weight="700">4. Механический поплавковый клапан</text>
      <path d="M90 110v185h300V110" fill="#f7fbfc" stroke="#427b91" stroke-width="4"/><path d="M95 215h290v75H95z" fill="#d8eef3"/><path d="M95 215h290" stroke="#1590ad" stroke-width="3"/>
      <path d="M25 140h125v25h80" fill="none" stroke="#087a9b" stroke-width="8"/><circle cx="230" cy="165" r="17" fill="#e2a257" stroke="#9a5a1d" stroke-width="3"/><path d="M230 165l90 44" stroke="#718995" stroke-width="7"/><ellipse cx="337" cy="220" rx="30" ry="17" fill="#e2a257" stroke="#9a5a1d" stroke-width="3"/>
      <text x="26" y="326" font-size="18">Поплавок рычагом закрывает подачу при верхнем уровне.</text>
      <text x="26" y="348" font-size="18" fill="#4e6874">Как бачок: нужен перелив и защита водопровода.</text>
    </g>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d28a38"/></marker></defs>
</svg>
