" stroke-linejoin="round"/><text x="1075" y="653" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#102747" text-anchor="start">Промывка фильтров</text><text x="1075" y="683" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#102747" text-anchor="start">если запас берётся из балансной ёмкости</text><rect x="945" y="772" width="455" height="135" rx="13" fill="#f3fbfe" stroke="#b0dbe9" stroke-width="2"/><path d="M1004 805.5 L1033 817.5 L1029 852.5 Q1018 868.5 1004 874.5 Q984 864.5 976 848.5 L975 817.5 Z" fill="#d9f9f5" stroke="#0874b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M988 840.5 l12 11 l22 -26" fill="none" stroke="#038c97" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1055 788 v103" fill="none" stroke="#03b9de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1075" y="811" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#102747" text-anchor="start">Эксплуатационный резерв</text><text x="1075" y="841" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#102747" text-anchor="start">учёт колебаний и особенностей системы</text><rect x="40" y="850" width="855" height="104" rx="16" fill="#d9f4fa" stroke="none" stroke-width="2"/><text x="468" y="913" font-family="Arial, DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#102747" text-anchor="middle">Vбал = Vвытесн + Vволн + Vраб + Vпром + Vрез</text><path d="M40 986 H1400" fill="none" stroke="#03b9de" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="1022" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#102747" text-anchor="start">Схема поясняет возможные составляющие. Не складывайте перекрывающиеся резервы дважды.</text><text x="47" y="1048" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#102747" text-anchor="start">Итоговый объём определяют по режимам работы, отметкам уровней и алгоритму автоматики.</text></svg>