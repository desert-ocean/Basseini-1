<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Где теряется напор в трубопроводе бассейна</title>
  <desc id="diagram-desc">Схема потока слева направо. Потери напора возникают на прямом участке трубы, поворотах, запорной арматуре, фильтре и оборудовании. Подписи показывают основные виды сопротивлений.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#137ca5"/><stop offset="1" stop-color="#36b1c9"/>
    </linearGradient>
    <linearGradient id="filter" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e9f3f6"/><stop offset="1" stop-color="#bfd5de"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#087da1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#142b3a" flood-opacity=".1"/></filter>
  </defs>
  <rect width="1200" height="630" rx="24" fill="#f7fafb"/>
  <text x="50" y="57" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#102c3c">Где теряется напор</text>
  <text x="50" y="91" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#526e7c">Каждый участок трубопровода и элемент системы создаёт сопротивление потоку воды</text>
  <rect x="36" y="116" width="1128" height="334" rx="20" fill="#fff" stroke="#deeaee" filter="url(#shadow)"/>
  <!-- pipeline -->
  <path d="M94 327 H242 Q264 327 264 305 V235 Q264 213 286 213 H995" fill="none" stroke="#d3e8ee" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M94 327 H242 Q264 327 264 305 V235 Q264 213 286 213 H995" fill="none" stroke="url(#water)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M134 327 H195 M316 213 H363 M884 213 H936" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- valve icon -->
  <path d="M433 195 L461 213 L433 231 Z M489 195 L461 213 L489 231 Z" fill="#e7a34b" stroke="#bd752c" stroke-width="2"/>
  <path d="M461 193 V169 H486" fill="none" stroke="#bd752c" stroke-width="4" stroke-linecap="round"/>
  <rect x="486" y="161" width="21" height="16" rx="4" fill="#e7a34b" stroke="#bd752c" stroke-width="2"/>
  <!-- filter -->
  <path d="M620 173 Q620 152 641 152 H712 Q733 152 733 173 V256 Q733 277 712 277 H641 Q620 277 620 256 Z" fill="url(#filter)" stroke="#5d94aa" stroke-width="4"/>
  <path d="M630 213 H723" stroke="#5d94aa" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M634 239 Q659 228 678 242 T720 238" stroke="#c49b69" stroke-width="9" fill="none" stroke-linecap="round" opacity=".85"/>
  <rect x="651" y="137" width="50" height="15" rx="5" fill="#5d94aa"/>
  <text x="677" y="201" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="15" fill="#245268">ФИЛЬТР</text>
  <!-- heat exchanger -->
  <rect x="805" y="183" width="70" height="60" rx="12" fill="#f9eddb" stroke="#d29a50" stroke-width="3"/>
  <path d="M822 198 Q839 207 822 217 T822 233 M842 198 Q859 207 842 217 T842 233 M861 198 Q878 207 861 217 T861 233" fill="none" stroke="#c77e31" stroke-width="3" stroke-linecap="round"/>
  <!-- labels top -->
  <rect x="77" y="157" width="181" height="54" rx="12" fill="#e8f5f9"/>
  <text x="167" y="179" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="15" fill="#15627d">Прямая труба</text>
  <text x="167" y="198" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#476a79">трение о стенки</text>
  <path d="M169 211 V300" stroke="#92b8c5" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="290" y="355" width="178" height="56" rx="12" fill="#e8f5f9"/>
  <text x="379" y="378" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="15" fill="#15627d">Поворот трубы</text>
  <text x="379" y="397" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#476a79">местное сопротивление</text>
  <path d="M290 370 L267 335" fill="none" stroke="#92b8c5" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="399" y="283" width="190" height="56" rx="12" fill="#fff4e6"/>
  <text x="494" y="306" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="15" fill="#9a5b1b">Запорная арматура</text>
  <text x="494" y="325" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#875f33">сопротивление крана</text>
  <path d="M461 233 V283" stroke="#d4a16c" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="599" y="301" width="156" height="56" rx="12" fill="#e8f5f9"/>
  <text x="677" y="324" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="15" fill="#15627d">Фильтр</text>
  <text x="677" y="343" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#476a79">потери на загрузке</text>
  <path d="M677 277 V301" stroke="#92b8c5" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="775" y="286" width="260" height="72" rx="12" fill="#fff4e6"/>
  <text x="905" y="309" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="15" fill="#9a5b1b">Доп. оборудование</text>
  <text x="905" y="330" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#875f33">теплообменник, УФ,</text>
  <text x="905" y="347" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#875f33">расходомер и др.</text>
  <path d="M840 243 V286" stroke="#d4a16c" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="65" y="473" width="1070" height="114" rx="18" fill="#eaf3f6"/>
  <rect x="89" y="493" width="5" height="73" rx="2" fill="#147e9e"/>
  <text x="110" y="515" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#133a4d">Общие потери напора складываются из:</text>
  <text x="110" y="543" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#315567">потерь на трение в трубах + местных сопротивлений + сопротивления оборудования.</text>
  <text x="110" y="569" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#587482">Статический перепад уровней учитывается отдельно — в зависимости от гидравлической схемы.</text>
</svg>
