<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 940" role="img" aria-labelledby="title desc"><title id="title">Вентиляция и осушение бассейна</title><desc id="desc">Вертикальная схема обработки наружного воздуха, подачи в бассейн, удаления влажного воздуха и теплообмена.</desc><defs><marker markerUnits="userSpaceOnUse" id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#087a9b"/></marker><marker markerUnits="userSpaceOnUse" id="b" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#c9782e"/></marker></defs><rect width="420" height="920" rx="18" fill="#f7fbfc"/><text x="210" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#193e52">ВЕНТИЛЯЦИЯ И ОСУШЕНИЕ</text><rect x="55" y="90" width="310" height="70" rx="12" fill="#e6f2f5" stroke="#547884" stroke-width="3"/><text x="210" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#193e52">Наружный воздух</text><text x="210" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193e52">приток для санитарного воздухообмена</text><path d="M210 160V205" stroke="#087a9b" stroke-width="7" marker-end="url(#a)"/><rect x="55" y="210" width="310" height="90" rx="12" fill="#fff" stroke="#547884" stroke-width="3"/><text x="210" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#193e52">Фильтр и теплообменник</text><text x="210" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193e52">коррозионная защита</text><text x="210" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193e52">контроль обмерзания</text><path d="M210 300V345" stroke="#087a9b" stroke-width="7" marker-end="url(#a)"/><rect x="55" y="350" width="310" height="92" rx="12" fill="#fff4e7" stroke="#c9782e" stroke-width="3"/><text x="210" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#754719">Нагрев / осушение</text><text x="210" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#754719">обрабатывается наружный воздух</text><path d="M210 442V487" stroke="#087a9b" stroke-width="7" marker-end="url(#a)"/><rect x="55" y="492" width="310" height="110" rx="12" fill="#e8f6fa" stroke="#087a9b" stroke-width="3"/><text x="210" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193e52">Зал бассейна</text><text x="210" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#193e52">приток тёплого сухого воздуха</text><path d="M365 548H400" fill="none" stroke="#c9782e" stroke-width="6" marker-end="url(#b)"/><text x="210" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#754719">Влажный воздух уходит на вытяжку</text><rect x="48" y="682" width="324" height="90" rx="12" fill="#fff" stroke="#547884" stroke-width="2"/><text x="210" y="717" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#193e52">Рекуператор: передача тепла</text><text x="210" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193e52">между потоками без смешения</text><path d="M210 772V815" stroke="#087a9b" stroke-width="5" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="210" y="846" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#193e52">Конденсат отводится в дренаж</text><text x="210" y="900" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#193e52">Рециркуляция из зала чаши не показана</text></svg>
