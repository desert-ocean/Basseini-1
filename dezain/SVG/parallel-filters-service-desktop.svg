<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Обслуживание одного фильтра при параллельной схеме</title>
  <desc id="desc">Сверху оба фильтра работают. Снизу один фильтр изолирован для промывки или обслуживания, а второй продолжает фильтрацию в режиме, проверенном проектом.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#087a9b"/></marker></defs>
  <rect width="1200" height="620" rx="24" fill="#f4f9fa"/>
  <text x="600" y="48" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="30" font-weight="800">ОБСЛУЖИВАНИЕ ОДНОЙ ВЕТВИ</text>
  <rect x="28" y="75" width="1144" height="230" rx="20" fill="#fff" stroke="#cbdde4" stroke-width="2"/>
  <text x="600" y="115" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="23" font-weight="800">РЕЖИМ ЭКСПЛУАТАЦИИ · РАБОТАЮТ ОБА ФИЛЬТРА</text>
  <path d="M80 215H190M190 175V250M190 175H312M190 250H312M558 175H780M558 250H780M780 175V250M780 213H1115" fill="none" stroke="#087a9b" stroke-width="7"/>
  <path d="M84 215H175M200 175H300M200 250H300M570 175H770M570 250H770M790 215H1105" fill="none" stroke="#087a9b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="316" y="140" width="238" height="70" rx="16" fill="#eaf5f7" stroke="#447f94" stroke-width="4"/><rect x="316" y="215" width="238" height="70" rx="16" fill="#eaf5f7" stroke="#447f94" stroke-width="4"/>
  <text x="435" y="183" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="20" font-weight="800">ФИЛЬТР 1 · В РАБОТЕ</text><text x="435" y="258" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="20" font-weight="800">ФИЛЬТР 2 · В РАБОТЕ</text>
  <rect x="28" y="330" width="1144" height="245" rx="20" fill="#fff" stroke="#cbdde4" stroke-width="2"/>
  <text x="600" y="370" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="23" font-weight="800">ПРОМЫВКА ИЛИ РЕМОНТ · ОДНА ВЕТВЬ ИЗОЛИРОВАНА</text>
  <path d="M80 478H190M190 438V513M190 438H312M190 513H312M558 438H780M558 513H780M780 438V513M780 475H1115" fill="none" stroke="#087a9b" stroke-width="7"/>
  <path d="M84 478H175M200 438H300M570 438H770M790 478H1105" fill="none" stroke="#087a9b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M200 513H300M570 513H770" fill="none" stroke="#a5b1b6" stroke-width="4" stroke-dasharray="10 9"/>
  <rect x="316" y="403" width="238" height="70" rx="16" fill="#eaf5f7" stroke="#447f94" stroke-width="4"/><rect x="316" y="478" width="238" height="70" rx="16" fill="#fff4e2" stroke="#c38b39" stroke-width="4"/>
  <text x="435" y="433" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="17" font-weight="800">ФИЛЬТР 1</text><text x="435" y="457" text-anchor="middle" fill="#087a9b" font-family="system-ui,sans-serif" font-size="15" font-weight="700">ПРОДОЛЖАЕТ ФИЛЬТРАЦИЮ</text>
  <text x="435" y="506" text-anchor="middle" fill="#193e52" font-family="system-ui,sans-serif" font-size="16" font-weight="800">ФИЛЬТР 2 · ИЗОЛИРОВАН</text><text x="435" y="531" text-anchor="middle" fill="#8c5b17" font-family="system-ui,sans-serif" font-size="15">промывка / обслуживание</text>
  <text x="600" y="602" text-anchor="middle" fill="#8c5b17" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Расход и режим оставшегося фильтра должны быть проверены проектом</text>
</svg>
