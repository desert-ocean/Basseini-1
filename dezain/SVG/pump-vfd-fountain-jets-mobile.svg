<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 900" role="img" aria-labelledby="t d">
<title id="t">Настройка высоты фонтанных струй</title><desc id="d">Две одинаковые группы форсунок: в условном режиме большей подачи струи выше, при снижении оборотов ниже. Зависимость качественная и определяется насосом, трубами и форсунками.</desc><rect width="500" height="900" rx="20" fill="#f3f8fa"/>
<g font-family="system-ui,sans-serif" fill="#193e52"><text x="250" y="40" text-anchor="middle" font-size="23" font-weight="700">Фонтанные струи и ПЧ</text>
<rect x="18" y="62" width="464" height="330" rx="18" fill="#fff" stroke="#c9dce4" stroke-width="2"/><text x="250" y="98" text-anchor="middle" font-size="19" font-weight="700">Более высокая частота</text><text x="250" y="125" text-anchor="middle" font-size="15">условно — выше подача</text><rect x="60" y="330" width="380" height="32" rx="9" fill="#d8f2f8"/><path d="M135 330Q132 205 135 185M250 330Q250 165 250 145M365 330Q368 205 365 185" fill="none" stroke="#36a9c8" stroke-width="8" stroke-linecap="round"/><path d="M100 330h300" stroke="#087a9b" stroke-width="5"/>
<rect x="18" y="414" width="464" height="330" rx="18" fill="#fff" stroke="#c9dce4" stroke-width="2"/><text x="250" y="450" text-anchor="middle" font-size="19" font-weight="700">Сниженные обороты</text><text x="250" y="477" text-anchor="middle" font-size="15">условно — ниже подача</text><rect x="60" y="682" width="380" height="32" rx="9" fill="#d8f2f8"/><path d="M135 682Q132 598 135 580M250 682Q250 560 250 542M365 682Q368 598 365 580" fill="none" stroke="#36a9c8" stroke-width="8" stroke-linecap="round"/><path d="M100 682h300" stroke="#087a9b" stroke-width="5"/>
<rect x="70" y="770" width="360" height="72" rx="14" fill="#eaf4f7" stroke="#9bbecb"/><text x="250" y="800" text-anchor="middle" font-size="17" font-weight="700">Насос + частотный</text><text x="250" y="824" text-anchor="middle" font-size="17">преобразователь</text>
<text x="250" y="875" text-anchor="middle" font-size="15" fill="#516d79">Струя зависит от системы; ветви балансируют.</text></g></svg>
