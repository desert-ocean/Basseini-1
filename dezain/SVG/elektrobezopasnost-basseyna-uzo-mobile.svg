<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1120" role="img" aria-labelledby="t d"><title id="t">УЗО: нормальная работа и утечка</title><desc id="d">Вертикальное сравнение баланса фазного и нейтрального токов и отключения при утечке. PE показан отдельным защитным проводником.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#167b98"/></marker><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c96c2d"/></marker></defs><rect width="420" height="1120" rx="22" fill="#f4f9fa"/><g font-family="Arial,sans-serif" fill="#17394c"><text x="22" y="48" font-size="25" font-weight="700">УЗО сравнивает L и N</text><rect x="18" y="75" width="384" height="470" rx="18" fill="#fff" stroke="#d5e6ea" stroke-width="3"/><text x="38" y="119" font-size="22" font-weight="700">Нормальная работа</text><text x="38" y="151" font-size="16">Токи сбалансированы</text><text x="36" y="217" font-size="20" font-weight="700">L</text><text x="36" y="325" font-size="20" font-weight="700">N</text><path d="M62 210H125M225 210H340M340 320H225M125 320H62" fill="none" stroke="#167b98" stroke-width="7" marker-end="url(#a)"/><rect x="125" y="180" width="100" height="172" rx="12" fill="#e7f4f7" stroke="#43869a" stroke-width="3"/><text x="153" y="251" font-size="20" font-weight="700">УЗО</text><circle cx="175" cy="290" r="19" fill="none" stroke="#43869a" stroke-width="4"/><rect x="250" y="240" width="118" height="65" rx="10" fill="#fff8ed" stroke="#cc8a4a" stroke-width="3"/><text x="266" y="280" font-size="18" font-weight="700">Нагрузка</text><path d="M305 305V400H360M360 390v18m-16 0h32m-27 9h22m-17 9h12" fill="none" stroke="#278267" stroke-width="5"/><text x="38" y="480" font-size="17">PE отдельно; рабочего тока в PE нет</text>
<rect x="18" y="570" width="384" height="520" rx="18" fill="#fff" stroke="#d5e6ea" stroke-width="3"/><text x="38" y="615" font-size="22" font-weight="700">Утечка при повреждении</text><text x="38" y="648" font-size="16">Появился дифференциальный ток</text><text x="36" y="713" font-size="20" font-weight="700">L</text><text x="36" y="821" font-size="20" font-weight="700">N</text><path d="M62 706H125M225 706H340M340 816H225M125 816H62" fill="none" stroke="#167b98" stroke-width="7" marker-end="url(#a)"/><rect x="125" y="676" width="100" height="172" rx="12" fill="#fff0e8" stroke="#c96c2d" stroke-width="3"/><text x="153" y="747" font-size="20" font-weight="700">УЗО</text><circle cx="175" cy="786" r="19" fill="none" stroke="#c96c2d" stroke-width="4"/><path d="M146 692l58 58m0-58-58 58" stroke="#c96c2d" stroke-width="4"/><rect x="250" y="736" width="118" height="65" rx="10" fill="#fff8ed" stroke="#cc8a4a" stroke-width="3"/><text x="266" y="776" font-size="18" font-weight="700">Нагрузка</text><path d="M305 801V906H360M280 801V870H220V941H350" fill="none" stroke="#278267" stroke-width="5"/><path d="M286 838l-42 35m0 0 4-18m-4 18 18-5" fill="none" stroke="#c96c2d" stroke-width="5" marker-end="url(#f)"/><path d="M360 896v18m-16 0h32m-27 9h22m-17 9h12" stroke="#278267" stroke-width="4"/><text x="38" y="1002" font-size="17" font-weight="700">Небаланс → отключение цепи</text><text x="38" y="1035" font-size="15">УЗО измеряет L и N, не только PE</text></g></svg>