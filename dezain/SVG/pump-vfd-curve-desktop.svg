<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d">
<title id="t">Рабочая точка насоса при изменении частоты</title><desc id="d">График напора от расхода показывает две нисходящие характеристики центробежного насоса: на больших оборотах и сниженных. Возрастающая характеристика системы пересекает каждую в своей рабочей точке; при снижении оборотов расход и напор рабочей точки уменьшаются.</desc>
<rect width="1000" height="600" rx="22" fill="#f3f8fa"/><text x="500" y="45" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#193e52">Изменение рабочей точки насоса</text>
<g stroke="#cbdde4" stroke-width="1" fill="none"><path d="M150 110V485H850M150 410H850M150 335H850M150 260H850M150 185H850M290 110V485M430 110V485M570 110V485M710 110V485"/></g>
<g stroke="#193e52" stroke-width="3" fill="none"><path d="M150 485H865M150 500V100"/></g><g font-family="system-ui,sans-serif" fill="#193e52"><text x="500" y="540" text-anchor="middle" font-size="20">Расход Q</text><text x="78" y="300" text-anchor="middle" font-size="20" transform="rotate(-90 78 300)">Напор H</text>
<path d="M180 150C340 170 530 260 790 455" fill="none" stroke="#087a9b" stroke-width="6"/><text x="570" y="205" font-size="17" fill="#087a9b">Насос: большие обороты</text>
<path d="M180 240C340 260 530 325 790 460" fill="none" stroke="#bd742d" stroke-width="6"/><text x="570" y="287" font-size="17" fill="#9b5e21">Насос: сниженные обороты</text>
<path d="M180 460C340 430 555 350 790 250" fill="none" stroke="#596c75" stroke-width="6" stroke-dasharray="12 8"/><text x="640" y="375" font-size="17" fill="#516d79">Система</text>
<circle cx="604" cy="326" r="9" fill="#087a9b" stroke="#fff" stroke-width="3"/><path d="M604 326v159" stroke="#087a9b" stroke-width="2" stroke-dasharray="5 5"/><text x="590" y="309" text-anchor="end" font-size="18" font-weight="700">A</text>
<circle cx="549" cy="347" r="9" fill="#bd742d" stroke="#fff" stroke-width="3"/><path d="M549 347v138" stroke="#bd742d" stroke-width="2" stroke-dasharray="5 5"/><text x="533" y="379" text-anchor="end" font-size="18" font-weight="700">B</text>
<rect x="150" y="560" width="700" height="28" rx="10" fill="#eaf4f7"/><text x="500" y="580" text-anchor="middle" font-size="15">A — выше скорость; B — ниже скорость. Кривые условные, не характеристики конкретной модели.</text></g></svg>
