<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Микроклимат крытого бассейна</title><desc id="desc">Приток тёплого сухого воздуха вдоль холодного остекления, удаление тёплого влажного воздуха сверху, параметры воды и рабочей зоны.</desc><defs><marker markerUnits="userSpaceOnUse" id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#087a9b"/></marker><marker markerUnits="userSpaceOnUse" id="b" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#c9782e"/></marker></defs><rect width="1000" height="540" rx="20" fill="#f7fbfc"/><text x="500" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#193e52">МИКРОКЛИМАТ КРЫТОГО БАССЕЙНА</text><path d="M95 115V390H905V115" fill="#fff" stroke="#6e8791" stroke-width="5"/><path d="M95 115H905" stroke="#6e8791" stroke-width="5"/><rect x="112" y="145" width="100" height="198" fill="#e7f4f8" stroke="#60a2b4" stroke-width="4"/><path d="M140 152V335M180 152V335" stroke="#9fcbd5" stroke-width="3"/><text x="162" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#193e52">ОКНО</text><path d="M165 346C270 320 345 320 425 340" fill="none" stroke="#30a0bb" stroke-width="7" marker-end="url(#a)"/><text x="300" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087a9b">тёплый сухой приток вдоль остекления</text><rect x="320" y="362" width="340" height="28" rx="14" fill="#81c7dc" stroke="#087a9b" stroke-width="3"/><path d="M340 357Q370 335 400 357T460 357T520 357T580 357T640 357" fill="none" stroke="#087a9b" stroke-width="3"/><text x="490" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193e52">вода 26–32 °C · испарение зависит от режима</text><path d="M620 322V155H825V110" fill="none" stroke="#c9782e" stroke-width="8" marker-end="url(#b)"/><text x="760" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9b5922">тёплый влажный воздух</text><text x="830" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e52">вытяжка</text><path d="M280 260H720" stroke="#556f7a" stroke-dasharray="9 8" stroke-width="2"/><text x="500" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#193e52">рабочая зона: скорость воздуха ≤ 0,2 м/с</text><rect x="735" y="206" width="148" height="72" rx="12" fill="#fff4e7" stroke="#c9782e" stroke-width="3"/><text x="809" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#754719">зона риска</text><text x="809" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#754719">конденсации</text><rect x="96" y="455" width="808" height="52" rx="12" fill="#eaf3f6"/><text x="500" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193e52">Воздух 29–31 °C* · влажность по расчёту и области нормирования</text><text x="500" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#516d79">* Ориентир оптимума ГОСТ для спортивных и физкультурно-оздоровительных чаш в холодный период.</text></svg>
