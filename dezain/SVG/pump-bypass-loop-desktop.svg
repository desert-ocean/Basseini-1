<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="t d">
<title id="t">Регулировочный байпас насоса</title><desc id="d">Вода поступает по всасывающей линии в насос. После насоса поток делится: полезный расход идёт к потребителю, а часть возвращается через регулирующий вентиль с нагнетания на всасывание. Схема требует проверки ограничений насоса.</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#087a9b"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#bd742d"/></marker></defs><rect width="1100" height="570" rx="22" fill="#f3f8fa"/>
<g font-family="system-ui,sans-serif" fill="#193e52"><text x="550" y="48" text-anchor="middle" font-size="28" font-weight="700">Перепускной байпас насоса</text>
<text x="95" y="295" text-anchor="middle" font-size="19">Всасывание</text><path d="M80 330H385" fill="none" stroke="#087a9b" stroke-width="10" marker-end="url(#a)"/>
<circle cx="435" cy="330" r="52" fill="#fff" stroke="#447f94" stroke-width="5"/><path d="M414 300v60l52-30z" fill="#087a9b"/><text x="435" y="410" text-anchor="middle" font-size="18" font-weight="700">Центробежный насос</text>
<path d="M487 330H945" fill="none" stroke="#087a9b" stroke-width="10" marker-end="url(#a)"/><text x="750" y="305" text-anchor="middle" font-size="18" font-weight="700">Полезный поток</text><rect x="945" y="275" width="125" height="110" rx="14" fill="#fff" stroke="#447f94" stroke-width="4"/><text x="1007" y="322" text-anchor="middle" font-size="17">Основной</text><text x="1007" y="348" text-anchor="middle" font-size="17">потребитель</text>
<path d="M700 330V165H260V330" fill="none" stroke="#bd742d" stroke-width="8" marker-end="url(#b)"/><path d="M680 165h40" stroke="#bd742d" stroke-width="6"/><path d="M660 142l25 23-25 23M740 142l-25 23 25 23" fill="#fff7ed" stroke="#bd742d" stroke-width="4"/><text x="700" y="120" text-anchor="middle" font-size="18" font-weight="700">Регулирующий вентиль</text><text x="490" y="150" text-anchor="middle" font-size="17" fill="#9b5e21">Рециркуляционный поток</text><text x="260" y="380" text-anchor="middle" font-size="16">возврат к всасыванию</text>
<rect x="55" y="445" width="990" height="86" rx="14" fill="#fff4e8" stroke="#e5c397"/><text x="78" y="478" font-size="18" font-weight="700" fill="#754315">Внимание: часть энергии теряется, вода может нагреваться.</text><text x="78" y="508" font-size="16" fill="#754315">Проверьте минимальный расход, температуру, охлаждение и ограничения изготовителя насоса.</text></g></svg>
