<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">Инженерный справочник ALPOOL — бассейн, расчёты и оборудование</title>
  <desc id="desc">Изометрическая иллюстрация бассейна с фильтром, насосом и плавающей панелью расчётов. Символизирует открытые инженерные знания и самостоятельный подбор оборудования.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09273f"/><stop offset=".58" stop-color="#0c4661"/><stop offset="1" stop-color="#0b6070"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7de4e4"/><stop offset=".45" stop-color="#26b9d0"/><stop offset="1" stop-color="#1282b7"/></linearGradient>
    <linearGradient id="poolWall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c9eff2"/><stop offset="1" stop-color="#4ba0bc"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8feff"/><stop offset="1" stop-color="#deeff5"/></linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#a4cddc"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#4ce7e2" stop-opacity=".27"/><stop offset="1" stop-color="#4ce7e2" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-35%" y="-45%" width="170%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="17" flood-color="#00182a" flood-opacity=".3"/></filter>
    <clipPath id="waterClip"><path d="M100 280 300 183 523 274 322 372Z"/></clipPath>
    <pattern id="tile" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="matrix(.90 -.43 .90 .37 0 0)"><path d="M28 0H0V28" fill="none" stroke="#d6fcff" stroke-opacity=".27" stroke-width="1.6"/></pattern>
  </defs>
  <rect width="800" height="540" rx="34" fill="url(#bg)"/>
  <circle cx="405" cy="260" r="300" fill="url(#glow)"/>
  <g fill="none" stroke="#b5f8ed" stroke-opacity=".13" stroke-width="1.3">
    <path d="M0 130C170 50 244 165 392 98S643 46 800 113"/>
    <path d="M0 161C170 81 244 196 392 129S643 77 800 144"/>
    <path d="M0 192C170 112 244 227 392 160S643 108 800 175"/>
    <path d="M15 445C200 387 295 503 472 424S692 398 815 425"/>
  </g>
  <!-- engineered pool, top-left to bottom-right isometric -->
  <g filter="url(#shadow)">
    <path d="M86 281 299 176 536 273 323 383Z" fill="#e6fbfc" stroke="#e1ffff" stroke-width="11" stroke-linejoin="round"/>
    <path d="M90 289 323 393 323 448 90 342Z" fill="url(#poolWall)" stroke="#b2e5e9" stroke-width="3"/>
    <path d="M323 393 538 284 538 336 323 448Z" fill="#3982a7" stroke="#91cddc" stroke-width="3"/>
    <path d="M100 280 300 183 523 274 322 372Z" fill="url(#water)"/>
    <path d="M100 280 300 183 523 274 322 372Z" fill="url(#tile)"/>
    <g clip-path="url(#waterClip)" fill="none" stroke="#e0ffff" stroke-linecap="round" opacity=".7">
      <path d="M79 288Q156 254 214 274T356 279T557 263" stroke-width="4"/>
      <path d="M91 320Q173 283 234 306T384 303T556 294" stroke-width="3" opacity=".6"/>
      <path d="M170 351Q250 313 311 334T449 332" stroke-width="3" opacity=".5"/>
    </g>
    <path d="M86 281 299 176 536 273 323 383Z" fill="none" stroke="#d9fbfa" stroke-width="11" stroke-linejoin="round"/>
    <path d="M94 282 299 182 529 273 323 377Z" fill="none" stroke="#6dd2dc" stroke-width="3"/>
  </g>
  <!-- piping joining equipment -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M466 372V421Q466 434 481 434H581" stroke="#052b46" stroke-width="18"/>
    <path d="M466 372V421Q466 434 481 434H581" stroke="#5de0d4" stroke-width="10"/>
    <path d="M388 414V466Q388 476 404 476H580" stroke="#052b46" stroke-width="18"/>
    <path d="M388 414V466Q388 476 404 476H580" stroke="#5de0d4" stroke-width="10"/>
    <path d="M501 434h15" stroke="#eaffff" stroke-width="3"/>
    <path d="M504 476h15" stroke="#eaffff" stroke-width="3"/>
  </g>
  <!-- pump -->
  <g filter="url(#shadow)" transform="translate(530 396)">
    <rect x="0" y="9" width="85" height="58" rx="14" fill="#ecf9fc"/>
    <rect x="-9" y="24" width="33" height="30" rx="8" fill="#8ad1df" stroke="#e7fbff" stroke-width="4"/>
    <rect x="69" y="22" width="23" height="32" rx="9" fill="#68b5cd" stroke="#e3f8fc" stroke-width="4"/>
    <circle cx="40" cy="38" r="21" fill="#166385"/>
    <circle cx="40" cy="38" r="12" fill="none" stroke="#89e5e6" stroke-width="4" stroke-dasharray="16 6"/>
    <path d="M15 68h60" stroke="#a3e2e9" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- filter -->
  <g filter="url(#shadow)" transform="translate(647 333)">
    <rect x="4" y="17" width="89" height="133" rx="39" fill="url(#tank)" stroke="#eaffff" stroke-width="3"/>
    <path d="M8 71h81v33H8z" fill="#3bb9c8" opacity=".8"/>
    <path d="M8 90Q49 80 89 90" fill="none" stroke="#e0ffff" stroke-width="4" opacity=".75"/>
    <ellipse cx="48" cy="20" rx="35" ry="10" fill="#d8f3f8" stroke="#ffffff" stroke-width="3"/>
    <path d="M48 7V-6h23" stroke="#91d4dc" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="74" cy="-6" r="11" fill="#f5fcff" stroke="#72b9c8" stroke-width="3"/>
    <path d="M74-6l6-4" stroke="#1387a6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 151v13m37-13v13" stroke="#badfe8" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- readable symbolic calculation card, no tiny written labels -->
  <g transform="translate(402 69)" filter="url(#shadow)">
    <rect width="286" height="210" rx="22" fill="url(#panel)"/>
    <rect width="286" height="44" rx="22" fill="#d6eff5"/>
    <path d="M0 26h286v18H0z" fill="#d6eff5"/>
    <circle cx="27" cy="22" r="6" fill="#2eb9bf"/>
    <circle cx="48" cy="22" r="6" fill="#87ccdb"/>
    <circle cx="69" cy="22" r="6" fill="#87ccdb"/>
    <rect x="23" y="65" width="105" height="123" rx="14" fill="#ffffff" stroke="#c2e1ec" stroke-width="2"/>
    <path d="M39 90h73M39 113h73M39 136h73M39 159h73" stroke="#c8e5eb" stroke-width="4" stroke-linecap="round"/>
    <path d="M52 79v94M77 79v94M101 79v94" stroke="#d6ecf1" stroke-width="2"/>
    <path d="M43 150 65 131 84 139 108 101" fill="none" stroke="#13a6b5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="43" cy="150" r="5" fill="#13a6b5"/><circle cx="65" cy="131" r="5" fill="#13a6b5"/><circle cx="84" cy="139" r="5" fill="#13a6b5"/><circle cx="108" cy="101" r="5" fill="#13a6b5"/>
    <rect x="144" y="65" width="119" height="56" rx="11" fill="#dcf4f5"/>
    <path d="M160 80h43" stroke="#8fb8c7" stroke-width="5" stroke-linecap="round"/>
    <path d="M160 98h55" stroke="#0e809e" stroke-width="9" stroke-linecap="round"/>
    <circle cx="242" cy="94" r="13" fill="#26b8b7"/>
    <path d="m236 94 5 5 9-10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="144" y="134" width="119" height="54" rx="11" fill="#ffffff" stroke="#c2e1ec" stroke-width="2"/>
    <g fill="#1b94ae"><rect x="160" y="164" width="11" height="12" rx="3"/><rect x="178" y="151" width="11" height="25" rx="3"/><rect x="196" y="143" width="11" height="33" rx="3"/><rect x="214" y="156" width="11" height="20" rx="3"/></g>
    <path d="m233 158 8 8 11-17" fill="none" stroke="#20b4af" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- small drafting/calc symbols -->
  <g transform="translate(160 83)" filter="url(#shadow)">
    <rect width="119" height="91" rx="20" fill="#e3f7f9"/>
    <rect x="17" y="18" width="85" height="55" rx="8" fill="#0a607e"/>
    <path d="M28 36h29m-14-9v18" stroke="#b7fff6" stroke-width="5" stroke-linecap="round"/>
    <path d="M69 34h20M69 46h20M69 59h20" stroke="#8adee7" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#8cedef" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M308 104v-15m-8 7h16"/>
    <path d="M80 174v-13m-7 7h14"/>
    <path d="M743 241v-13m-7 7h14"/>
    <circle cx="91" cy="397" r="5"/>
    <circle cx="349" cy="91" r="4"/>
  </g>
</svg>
