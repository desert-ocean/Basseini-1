<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" role="img" aria-labelledby="title desc"><title id="title">Почему появляется конденсат</title><desc id="desc">Два вертикально расположенных примера: поверхность холоднее точки росы и снижение риска подачей тёплого воздуха.</desc><defs><marker markerUnits="userSpaceOnUse" id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#087a9b"/></marker></defs><rect width="420" height="900" rx="18" fill="#f7fbfc"/><text x="210" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193e52">ПОЧЕМУ ПОЯВЛЯЕТСЯ КОНДЕНСАТ</text><rect x="25" y="78" width="370" height="360" rx="14" fill="#fff" stroke="#d3e2e8" stroke-width="3"/><text x="210" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193e52">1. Холодное окно</text><rect x="52" y="145" width="54" height="200" fill="#b9d8e1" stroke="#547884" stroke-width="4"/><path d="M68 150V340M90 150V340" stroke="#edf8fa" stroke-width="4"/><circle cx="126" cy="192" r="7" fill="#4b91a6"/><circle cx="134" cy="228" r="6" fill="#4b91a6"/><circle cx="124" cy="266" r="8" fill="#4b91a6"/><text x="154" y="174" font-family="Arial,sans-serif" font-size="16" fill="#193e52">Воздух: 30 °C, 60%</text><text x="154" y="208" font-family="Arial,sans-serif" font-size="16" fill="#193e52">Точка росы ≈ 21,4 °C</text><text x="154" y="242" font-family="Arial,sans-serif" font-size="16" fill="#193e52">Стекло: 19 °C</text><text x="154" y="278" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#a44f27">19 ниже 21,4 °C</text><text x="210" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#a44f27">Конденсация вероятна</text><rect x="25" y="460" width="370" height="370" rx="14" fill="#fff" stroke="#d3e2e8" stroke-width="3"/><text x="210" y="498" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#193e52">2. Тёплый воздух вдоль окна</text><rect x="52" y="535" width="54" height="190" fill="#b9d8e1" stroke="#547884" stroke-width="4"/><path d="M68 540V720M90 540V720" stroke="#edf8fa" stroke-width="4"/><path d="M42 730C55 675 68 620 70 550" fill="none" stroke="#087a9b" stroke-width="8" marker-end="url(#a)"/><text x="135" y="570" font-family="Arial,sans-serif" font-size="16" fill="#193e52">Сухая тёплая струя</text><text x="135" y="604" font-family="Arial,sans-serif" font-size="16" fill="#193e52">обмывает стекло,</text><text x="135" y="638" font-family="Arial,sans-serif" font-size="16" fill="#193e52">снижая риск росы.</text><text x="210" y="775" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#516d79">Теплотехнический расчёт обязателен</text><text x="210" y="852" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#193e52">Оценка риска:</text><text x="210" y="878" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#193e52">точка росы и температура поверхности</text></svg>
