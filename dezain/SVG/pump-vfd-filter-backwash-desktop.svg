<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="t d">
<title id="t">Один насос: фильтрация и обратная промывка</title><desc id="d">Две отдельные схемы режимов. При фильтрации вода проходит из бассейна через насос и фильтр обратно в чашу. При промывке направление через фильтр меняется и вода уходит в канализацию. Режимы взаимоисключающие.</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#087a9b"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#bd742d"/></marker></defs>
<rect width="1100" height="570" rx="22" fill="#f3f8fa"/><text x="550" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#193e52">Один насос — два раздельных режима</text>
<g font-family="system-ui,sans-serif" fill="#193e52">
<rect x="28" y="75" width="510" height="450" rx="18" fill="#fff" stroke="#c9dce4" stroke-width="2"/><text x="55" y="115" font-size="22" font-weight="700">1. Фильтрация</text>
<rect x="55" y="245" width="115" height="105" rx="12" fill="#e8f6fb" stroke="#54a4bb" stroke-width="3"/><path d="M63 285h99" stroke="#39a8c7" stroke-width="8"/><text x="112" y="320" text-anchor="middle" font-size="18">Бассейн</text>
<circle cx="250" cy="298" r="42" fill="#f1f7fa" stroke="#447f94" stroke-width="4"/><path d="M234 276v44l39-22z" fill="#087a9b"/><text x="250" y="365" text-anchor="middle" font-size="17">Насос + ПЧ</text>
<rect x="355" y="250" width="110" height="95" rx="30" fill="#edf5f7" stroke="#447f94" stroke-width="4"/><path d="M370 305h80" stroke="#bd9a63" stroke-width="8"/><text x="410" y="295" text-anchor="middle" font-size="16">Фильтр</text>
<path d="M170 270H208M292 270H355M465 270H490V205H112V245" fill="none" stroke="#087a9b" stroke-width="7" marker-end="url(#a)"/>
<rect x="55" y="390" width="455" height="116" rx="12" fill="#eaf4f7"/><text x="75" y="425" font-size="18" font-weight="700">Условный пример расхода: 20 м³/ч</text><text x="75" y="455" font-size="16">Уставка фильтрации — по расчёту системы</text><text x="75" y="485" font-size="16">Частоту выбирают по рабочей точке насоса</text>
<rect x="562" y="75" width="510" height="450" rx="18" fill="#fff" stroke="#c9dce4" stroke-width="2"/><text x="590" y="115" font-size="22" font-weight="700">2. Обратная промывка</text>
<rect x="590" y="245" width="90" height="95" rx="28" fill="#edf5f7" stroke="#447f94" stroke-width="4"/><path d="M602 300h65" stroke="#bd9a63" stroke-width="8"/><text x="635" y="285" text-anchor="middle" font-size="15">Фильтр</text>
<circle cx="770" cy="298" r="42" fill="#f1f7fa" stroke="#447f94" stroke-width="4"/><path d="M754 276v44l39-22z" fill="#087a9b"/><text x="770" y="365" text-anchor="middle" font-size="17">Насос + ПЧ</text>
<rect x="875" y="250" width="92" height="95" rx="10" fill="#fff7ed" stroke="#bd742d" stroke-width="3"/><text x="921" y="288" text-anchor="middle" font-size="16">Слив</text><text x="921" y="313" text-anchor="middle" font-size="16">в канал.</text>
<path d="M728 270H680" fill="none" stroke="#bd742d" stroke-width="7" marker-end="url(#b)"/><path d="M635 245V190H921V250" fill="none" stroke="#bd742d" stroke-width="7" marker-end="url(#b)"/>
<rect x="590" y="390" width="455" height="116" rx="12" fill="#fff4e8"/><text x="610" y="425" font-size="18" font-weight="700">Условный пример расхода: 30 м³/ч</text><text x="610" y="455" font-size="16">Уставка промывки — по расчёту системы</text><text x="610" y="485" font-size="16">Расход задают фильтр и тип загрузки</text>
</g></svg>
