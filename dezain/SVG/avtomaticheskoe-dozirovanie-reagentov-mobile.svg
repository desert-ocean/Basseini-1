<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1390" role="img" aria-labelledby="title desc">
<title id="title">Автоматическое дозирование реагентов: схема работы и защит</title>
<desc id="desc">Вертикальная схема показывает пробу и датчики, контроллер с разрешением по протоку, два отдельных дозатора и точки впрыска; ниже показаны проверки времени и дозы, сигнал уровня реагента, блокировка при ошибке и безопасная остановка.</desc>
<defs>
<marker id="m-water-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#087a9b"/></marker>
<marker id="m-chem-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bd762a"/></marker>
<style>
 text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#193e52}.title{font-size:22px;font-weight:700}.head{font-size:19px;font-weight:700}.label{font-size:17px}.small{font-size:15px}.bold{font-weight:700}.card{fill:#fff;stroke:#b8d0d9;stroke-width:2}.blue{fill:#e8f5f8;stroke:#4a8798;stroke-width:2}.gold{fill:#fff4e4;stroke:#c58b49;stroke-width:2}.green{fill:#eaf5f0;stroke:#538c73;stroke-width:2}.red{fill:#fff0ed;stroke:#be786e;stroke-width:2}
</style>
</defs>
<rect width="390" height="1390" rx="20" fill="#f5f9fa"/>
<text class="title" x="20" y="34">Станция дозирования</text>
<text class="head" x="20" y="68">1. Измерить и отрегулировать</text>
<g>
<rect class="blue" x="20" y="88" width="350" height="126" rx="14"/>
<text class="head" x="195" y="119" text-anchor="middle">Проба в проточной ячейке</text>
<rect x="47" y="134" width="112" height="40" rx="9" fill="#fff" stroke="#4a8798" stroke-width="2"/><text class="label bold" x="103" y="160" text-anchor="middle">датчик pH</text>
<rect x="171" y="134" width="172" height="40" rx="9" fill="#fff" stroke="#4a8798" stroke-width="2"/><text class="label bold" x="257" y="160" text-anchor="middle">св. хлор или ОВП*</text>
<text class="small" x="195" y="198" text-anchor="middle">*ОВП — косвенный показатель, не анализ хлора</text>
<path d="M195 214V232" stroke="#526879" stroke-width="3" marker-end="url(#m-water-arrow)"/>
<rect class="card" x="20" y="238" width="350" height="100" rx="14"/>
<text class="head" x="195" y="274" text-anchor="middle">Контроллер проверяет</text><text class="label" x="195" y="305" text-anchor="middle">значение, исправность датчика и проток</text>
<rect class="green" x="49" y="314" width="292" height="16" rx="8"/><text class="small bold" x="195" y="328" text-anchor="middle">Дозирование разрешено только при протоке</text>
<path d="M195 338V356" stroke="#526879" stroke-width="3" marker-end="url(#m-water-arrow)"/>
<rect class="gold" x="20" y="362" width="350" height="128" rx="14"/>
<text class="head" x="195" y="398" text-anchor="middle">Два отдельных дозатора</text>
<rect x="42" y="414" width="142" height="56" rx="10" fill="#fff" stroke="#c58b49" stroke-width="2"/><text class="label bold" x="113" y="439" text-anchor="middle">реагент pH</text><text class="small" x="113" y="460" text-anchor="middle">своя ёмкость/линия</text>
<rect x="206" y="414" width="142" height="56" rx="10" fill="#fff" stroke="#c58b49" stroke-width="2"/><text class="label bold" x="277" y="439" text-anchor="middle">дезинфектант</text><text class="small" x="277" y="460" text-anchor="middle">своя ёмкость/линия</text>
<path d="M195 490V508" stroke="#526879" stroke-width="3" marker-end="url(#m-water-arrow)"/>
<rect class="blue" x="20" y="514" width="350" height="106" rx="14"/>
<text class="head" x="195" y="550" text-anchor="middle">Разные точки впрыска</text><text class="label" x="195" y="580" text-anchor="middle">реагент смешивается с циркуляционным</text><text class="label" x="195" y="604" text-anchor="middle">потоком, затем выполняется новый замер</text>
<path d="M48 634H342" fill="none" stroke="#087a9b" stroke-width="7" marker-end="url(#m-water-arrow)"/>
<text class="small" x="195" y="660" text-anchor="middle">Поток после фильтра → впрыск → чаша</text>
</g>
<text class="head" x="20" y="706">2. Перед подачей — проверки защит</text>
<g>
<rect class="card" x="20" y="724" width="350" height="72" rx="12"/><text class="label bold" x="195" y="754" text-anchor="middle">1. Циркуляция подтверждена?</text><text class="small" x="195" y="779" text-anchor="middle">реле протока / измерение расхода</text>
<path d="M195 796V812" stroke="#526879" stroke-width="2.5" marker-end="url(#m-water-arrow)"/>
<rect class="card" x="20" y="818" width="350" height="72" rx="12"/><text class="label bold" x="195" y="848" text-anchor="middle">2. Сигнал датчика достоверен?</text><text class="small" x="195" y="873" text-anchor="middle">нет обрыва, ошибки или невозможного значения</text>
<path d="M195 890V906" stroke="#526879" stroke-width="2.5" marker-end="url(#m-water-arrow)"/>
<rect class="card" x="20" y="912" width="350" height="72" rx="12"/><text class="label bold" x="195" y="942" text-anchor="middle">3. Лимиты времени и дозы не исчерпаны?</text><text class="small" x="195" y="967" text-anchor="middle">пределы устанавливают по проекту</text>
<path d="M195 984V1000" stroke="#526879" stroke-width="2.5" marker-end="url(#m-water-arrow)"/>
<rect class="green" x="20" y="1006" width="350" height="58" rx="12"/><text class="label bold" x="195" y="1042" text-anchor="middle">Все условия выполнены → дозировать</text>
<rect class="red" x="20" y="1076" width="350" height="78" rx="12"/><text class="label bold" x="195" y="1108" text-anchor="middle">Ошибка или «нет» → остановить насосы</text><text class="small" x="195" y="1134" text-anchor="middle">тревога и проверка перед возвратом</text>
</g>
<text class="head" x="20" y="1193">Отдельные ёмкости и контроль уровня</text>
<g>
<rect class="gold" x="20" y="1210" width="166" height="112" rx="12"/>
<path d="M54 1244h98v54H54z" fill="#fff" stroke="#c58b49" stroke-width="2"/><path d="M68 1244v-11h70v11" fill="none" stroke="#c58b49" stroke-width="2"/><text class="small bold" x="103" y="1275" text-anchor="middle">ёмкость pH</text><text class="small" x="103" y="1295" text-anchor="middle">датчик уровня</text>
<rect class="gold" x="204" y="1210" width="166" height="112" rx="12"/>
<path d="M238 1244h98v54h-98z" fill="#fff" stroke="#c58b49" stroke-width="2"/><path d="M252 1244v-11h70v11" fill="none" stroke="#c58b49" stroke-width="2"/><text class="small bold" x="287" y="1275" text-anchor="middle">ёмкость</text><text class="small" x="287" y="1295" text-anchor="middle">дезинфектанта</text>
<text class="small" x="195" y="1354" text-anchor="middle">Раздельные линии и обратные клапаны;</text><text class="small" x="195" y="1375" text-anchor="middle">совместимость и лимиты проверяют по проекту</text>
</g>
</svg>