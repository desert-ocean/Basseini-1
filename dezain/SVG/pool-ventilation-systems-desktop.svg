<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Вентиляция и осушение бассейна</title><desc id="desc">Наружный воздух фильтруется, получает тепло вытяжного воздуха, подогревается и при необходимости осушается перед подачей в зал; влажный воздух удаляется, конденсат отводится.</desc><defs><marker markerUnits="userSpaceOnUse" id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#087a9b"/></marker><marker markerUnits="userSpaceOnUse" id="b" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#c9782e"/></marker></defs><rect width="1000" height="520" rx="18" fill="#f7fbfc"/><text x="500" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#193e52">НАРУЖНЫЙ ВОЗДУХ, ТЕПЛООБМЕН И ОСУШЕНИЕ</text><rect x="45" y="185" width="120" height="90" rx="12" fill="#e6f2f5" stroke="#547884" stroke-width="3"/><text x="105" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e52">Наружный</text><text x="105" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#193e52">воздух</text><path d="M165 230H220" stroke="#087a9b" stroke-width="7" marker-end="url(#a)"/><rect x="225" y="175" width="128" height="110" rx="12" fill="#fff" stroke="#547884" stroke-width="3"/><text x="289" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#193e52">Фильтр</text><text x="289" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193e52">и рекуператор</text><path d="M353 230H410" stroke="#087a9b" stroke-width="7" marker-end="url(#a)"/><rect x="415" y="175" width="145" height="110" rx="12" fill="#fff4e7" stroke="#c9782e" stroke-width="3"/><text x="487" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#754719">Нагрев /</text><text x="487" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#754719">осушение</text><text x="487" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#754719">наружного воздуха</text><path d="M560 230H615" stroke="#087a9b" stroke-width="7" marker-end="url(#a)"/><rect x="620" y="150" width="165" height="160" rx="12" fill="#e8f6fa" stroke="#087a9b" stroke-width="3"/><text x="702" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#193e52">Зал бассейна</text><path d="M647 248H750" stroke="#087a9b" stroke-width="5" marker-end="url(#a)"/><text x="702" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193e52">приток</text><text x="289" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#193e52">потоки разделены</text><text x="880" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#754719">влажный воздух</text><rect x="418" y="340" width="142" height="72" rx="10" fill="#edf5f7" stroke="#547884" stroke-width="2"/><text x="489" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#193e52">Конденсат</text><text x="489" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193e52">отвод в дренаж</text><path d="M487 285V340" stroke="#087a9b" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M810 250H922" stroke="#c9782e" stroke-width="7" marker-end="url(#b)"/><text x="865" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#754719">вытяжка наружу</text><rect x="60" y="445" width="880" height="48" rx="10" fill="#eaf3f6"/><text x="500" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#193e52">Схема не подразумевает рециркуляцию воздуха из зала чаши</text><text x="500" y="516" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#516d79">* Рекуператор подбирают по коррозионной стойкости, гигиене, риску переноса влаги и обмерзанию.</text></svg>
