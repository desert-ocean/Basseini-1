<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Почему появляется конденсат и как снизить риск</title><desc id="desc">Сравнение холодного окна ниже точки росы и окна с тёплой подачей воздуха вдоль стекла.</desc><defs><marker markerUnits="userSpaceOnUse" id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#087a9b"/></marker></defs><rect width="1000" height="500" rx="18" fill="#f7fbfc"/><text x="500" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#193e52">ТОЧКА РОСЫ И ХОЛОДНАЯ ПОВЕРХНОСТЬ</text><rect x="32" y="80" width="450" height="365" rx="16" fill="#fff" stroke="#d3e2e8" stroke-width="3"/><rect x="518" y="80" width="450" height="365" rx="16" fill="#fff" stroke="#d3e2e8" stroke-width="3"/><text x="257" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#193e52">1. Холодное окно</text><text x="743" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#193e52">2. Тёплый настилающийся поток</text><rect x="70" y="155" width="55" height="190" fill="#b9d8e1" stroke="#547884" stroke-width="4"/><path d="M85 160V340M108 160V340" stroke="#edf8fa" stroke-width="4"/><circle cx="145" cy="205" r="7" fill="#4b91a6"/><circle cx="155" cy="235" r="6" fill="#4b91a6"/><circle cx="142" cy="265" r="8" fill="#4b91a6"/><text x="230" y="180" font-family="Arial,sans-serif" font-size="18" fill="#193e52">Воздух: 30 °C, RH 60%</text><text x="230" y="215" font-family="Arial,sans-serif" font-size="18" fill="#193e52">Точка росы: ≈ 21,4 °C</text><text x="230" y="250" font-family="Arial,sans-serif" font-size="18" fill="#193e52">Поверхность: 19 °C</text><text x="230" y="285" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#a44f27">19 &lt; 21,4 °C → конденсат</text><path d="M232 310H412" stroke="#c9782e" stroke-width="3" stroke-dasharray="8 7"/><text x="257" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#516d79">Холодное стекло ниже точки росы</text><rect x="558" y="155" width="55" height="190" fill="#b9d8e1" stroke="#547884" stroke-width="4"/><path d="M573 160V340M596 160V340" stroke="#edf8fa" stroke-width="4"/><path d="M542 345C558 290 571 240 573 170" fill="none" stroke="#087a9b" stroke-width="8" marker-end="url(#a)"/><text x="650" y="190" font-family="Arial,sans-serif" font-size="18" fill="#193e52">Тёплый сухой воздух</text><text x="650" y="225" font-family="Arial,sans-serif" font-size="18" fill="#193e52">обмывает внутреннее стекло</text><text x="650" y="270" font-family="Arial,sans-serif" font-size="18" fill="#193e52">и повышает температуру</text><text x="650" y="305" font-family="Arial,sans-serif" font-size="18" fill="#193e52">пограничного слоя воздуха.</text><text x="743" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#516d79">Теплозащиту конструкции всё равно проверяют</text><rect x="82" y="465" width="836" height="45" rx="10" fill="#eaf3f6"/><text x="500" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#193e52">Точка росы — свойство воздуха; риск оценивают по температуре конкретной поверхности.</text></svg>
