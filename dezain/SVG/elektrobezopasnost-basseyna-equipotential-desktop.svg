<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Уравнивание потенциалов бассейна</title><desc id="d">Функциональная схема чаши: арматура, металлическая коммуникация и электрическое оборудование связаны проектными защитными проводниками с местной шиной и PE здания; поручень показан как деталь, не включаемая автоматически.</desc><rect width="1200" height="620" rx="24" fill="#f4f9fa"/><g font-family="Arial,sans-serif" fill="#17394c"><text x="35" y="52" font-size="30" font-weight="700">Защитные связи — только по проекту и определениям стандарта</text><path d="M90 270H770V450H90Z" fill="#dff2f5" stroke="#43869a" stroke-width="5"/><path d="M105 300H755" stroke="#167b98" stroke-width="5"/><text x="340" y="360" font-size="25" font-weight="700">Чаша и вода</text><path d="M120 425H740" stroke="#8b6d52" stroke-width="8" stroke-dasharray="12 8"/><text x="300" y="550" font-size="19">Арматура / металлическая конструкция чаши</text><path d="M470 425V520H870" fill="none" stroke="#278267" stroke-width="6" stroke-dasharray="12 7"/><rect x="870" y="474" width="190" height="90" rx="14" fill="#e8f5ef" stroke="#278267" stroke-width="4"/><text x="892" y="514" font-size="20" font-weight="700">Местная шина</text><text x="900" y="542" font-size="17">PE-проводники</text><path d="M1060 520H1130V460" fill="none" stroke="#278267" stroke-width="6"/><text x="1040" y="430" font-size="18">PE / ГЗШ здания</text><rect x="140" y="115" width="210" height="88" rx="12" fill="#fff" stroke="#c78a49" stroke-width="3"/><text x="163" y="151" font-size="20" font-weight="700">Поручень</text><text x="160" y="180" font-size="16">не автоматически</text><path d="M245 203V250" stroke="#8a969a" stroke-width="4" stroke-dasharray="8 7"/><rect x="490" y="115" width="220" height="88" rx="12" fill="#fff" stroke="#43869a" stroke-width="3"/><text x="514" y="151" font-size="20" font-weight="700">Металлотруба</text><text x="515" y="180" font-size="16">оценить как стороннюю</text><path d="M600 203V242H800V370H870V474" fill="none" stroke="#278267" stroke-width="5" stroke-dasharray="11 7"/><rect x="820" y="115" width="220" height="88" rx="12" fill="#fff" stroke="#43869a" stroke-width="3"/><text x="844" y="151" font-size="20" font-weight="700">Ниша светильника</text><text x="845" y="180" font-size="16">по конструкции и проекту</text><path d="M930 203V260H780V380H740" fill="none" stroke="#c78a49" stroke-width="4" stroke-dasharray="7 7"/><text x="85" y="600" font-size="18">Пластиковая труба и вода не заменяют PE; доступные металлические части оценивают отдельно.</text></g></svg>